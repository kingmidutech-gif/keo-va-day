<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hồ sơ ca Kéo đẩy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
  /* Tone màu lấy đúng từ keoday.midu.vn */
  :root{
    --cam:#DE7127; --cam-dam:#B4551A; --cam-sau:#8A3F11; --cam-toi:#5E2A0B;
    --cam-nhat:#FDF2EA; --cam-nhat2:#FAE3D2; --cam-vien:#F1CBAC;
    --vang:#FFBB00; --vang-chu:#8A6000; --vang-nhat:#FFF7E3; --vang-vien:#FFE08F;
    --trang:#FFFFFF; --vien:#EDE5DE;
    --ink:#111111; --ink-2:#1E1E1E; --ink-3:#3A3A3A; --ink-4:#6A5D54;
    --ok:#2C7A51; --ok-nen:#E2F3E9; --ok-vien:#B6DFC8;
    --cho:#8A6000; --cho-nen:#FFF2CF; --cho-vien:#FFE08F;
    --khong:#A4262C; --khong-nen:#FBE4E4; --khong-vien:#F0C2C2;
    --idle:#EFE7E0;
    --bong:0 1px 2px rgba(17,17,17,.04), 0 10px 28px rgba(138,63,17,.08);
    --noi:inset 0 2px 0 rgba(255,255,255,.95), 0 2px 3px rgba(138,63,17,.05), 0 12px 22px rgba(138,63,17,.09), 0 28px 46px rgba(138,63,17,.07);
    --r:18px; --r-sm:12px; --r-pill:24px;
    --dis:"Montserrat", system-ui, sans-serif;
    --sans:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--cam-nhat);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;font-family:var(--dis);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
  p{margin:0}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--cam-dam);text-underline-offset:2px}
  :focus-visible{outline:2px solid var(--cam);outline-offset:2px;border-radius:6px}
  .num{font-variant-numeric:tabular-nums}
  img{max-width:100%}
  code{font-family:var(--mono);font-size:12px;background:var(--vang-nhat);padding:1px 5px;border-radius:5px}

  /* ===== đăng nhập ===== */
  .gate{min-height:88vh;display:grid;place-items:center;padding:28px 16px 40px;
    background:radial-gradient(900px 420px at 50% -10%, var(--vang-nhat) 0%, transparent 62%), var(--cam-nhat)}
  .gate-card{width:100%;max-width:430px;background:var(--trang);border:1px solid var(--vien);
    border-radius:26px;box-shadow:var(--noi);padding:30px 28px 24px;text-align:center}
  @media(max-width:460px){.gate-card{padding:24px 20px 20px}}
  .gate-card img.lg{width:168px;height:auto;margin:0 auto 14px;display:block}
  .kicker{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.2em;color:var(--cam-dam)}
  .gate-card h1{font-size:23px;margin:7px 0 6px}
  .gate-card .sub{font-size:13.5px;color:var(--ink-3);max-width:34ch;margin:0 auto}
  .fld{text-align:left;margin-top:14px}
  .fld label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-4);margin-bottom:5px}
  .fld input{width:100%;background:var(--cam-nhat);border:2px solid var(--vien);border-radius:var(--r-sm);padding:11px 14px;font-size:15px}
  .fld input:focus{border-color:var(--cam);background:var(--trang)}
  .go{width:100%;margin-top:18px;background:var(--cam);color:#fff;border:0;border-radius:var(--r-pill);padding:13px 18px;
    font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 18px rgba(222,113,39,.32)}
  .go:hover{background:var(--cam-dam)}
  .go[disabled]{opacity:.6;cursor:default}
  .gate-err{color:var(--khong);font-size:13px;font-weight:600;margin-top:11px;min-height:19px}
  .gate-foot{margin-top:18px;padding-top:15px;border-top:1px solid var(--vien);font-size:12px;color:var(--ink-4)}
  .demo-note{margin-top:14px;background:var(--vang-nhat);border:1px solid var(--vang-vien);border-radius:var(--r-sm);
    padding:11px 13px;font-size:12.5px;color:var(--vang-chu);text-align:left}

  /* ===== khung ===== */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--trang);border-bottom:1px solid var(--vien)}
  .top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .top img.lg{width:104px;height:auto;display:block}
  .top .sep{width:1px;height:26px;background:var(--vien)}
  .top .wh{font-family:var(--dis);font-weight:700;font-size:13.5px;margin-right:auto;color:var(--ink-2)}
  .top-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .srch{background:var(--cam-nhat);border:1.5px solid var(--vien);border-radius:var(--r-pill);padding:7px 15px;width:200px}
  .srch:focus{border-color:var(--cam);background:var(--trang)}
  .who-chip{display:flex;align-items:center;gap:8px;background:var(--vang-nhat);border:1px solid var(--vang-vien);
    border-radius:var(--r-pill);padding:4px 6px 4px 13px;font-size:12.5px;font-weight:600;color:var(--vang-chu)}
  .who-chip button{background:var(--trang);border:1px solid var(--vang-vien);border-radius:var(--r-pill);
    padding:3px 11px;font-size:11.5px;cursor:pointer;color:var(--ink-3);font-weight:600}
  nav.tabs{background:var(--trang);border-bottom:3px solid var(--cam)}
  .tabs-in{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  .tabs-in::-webkit-scrollbar{display:none}
  .tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-3px;color:var(--ink-4);
    padding:10px 15px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13.5px}
  .tab:hover{color:var(--cam-dam)}
  .tab[aria-current="page"]{color:var(--cam-sau);border-bottom-color:var(--cam)}
  .tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;background:var(--khong);color:#fff;
    border-radius:9px;font-size:11px;font-weight:700;line-height:18px;text-align:center}
  .wrap{max-width:1240px;margin:0 auto;padding-left:20px;padding-right:20px;padding-block:24px 70px}
  @media(max-width:560px){.wrap{padding-left:16px;padding-right:16px}}

  .eyebrow{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.17em;color:var(--cam-dam)}
  .sec{margin-bottom:32px}
  .sec-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:13px}
  .sec-head h2{font-size:19px}
  .sec-head .sub{font-size:13px;color:var(--ink-3);margin-left:auto}
  .card{background:var(--trang);border:1px solid var(--vien);border-radius:var(--r);box-shadow:var(--bong)}
  .card-pad{padding:17px 19px}
  .ruler{height:9px;background:repeating-linear-gradient(to right,var(--cam-vien) 0 1px,transparent 1px 9px)}
  .hint{font-size:12.5px;color:var(--ink-4)}
  .banner{display:flex;gap:11px;border-radius:var(--r);padding:13px 16px;margin-bottom:18px;font-size:13px}
  .banner-cho{background:var(--vang-nhat);color:var(--vang-chu);border:1px solid var(--vang-vien)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
  .kpi{background:var(--trang);border:1px solid var(--vien);border-radius:var(--r);padding:14px 16px;box-shadow:var(--bong)}
  .kpi .n{font-family:var(--dis);font-size:30px;font-weight:800;line-height:1.05;color:var(--cam-toi)}
  .kpi .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-4);margin-top:2px}
  .kpi .f{font-size:12px;color:var(--ink-3);margin-top:5px}
  .kpi.ok .n{color:var(--ok)} .kpi.cho .n{color:var(--vang-chu)} .kpi.khong .n{color:var(--khong)}
  .two-col{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:18px;align-items:start}
  @media(max-width:900px){.two-col{grid-template-columns:1fr}}

  .todo{display:grid;gap:1px;background:var(--vien);border-radius:var(--r);overflow:hidden;border:1px solid var(--vien)}
  .todo-item{background:var(--trang);display:flex;gap:11px;align-items:flex-start;padding:12px 16px;width:100%;text-align:left;border:0;cursor:pointer}
  .todo-item:hover{background:var(--cam-nhat)}
  .todo-item .flag{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:7px}
  .f-stop{background:var(--khong)} .f-wait{background:var(--vang)} .f-info{background:var(--cam)}
  .todo-item .t1{font-weight:700}
  .todo-item .t2{font-size:12.5px;color:var(--ink-3)}
  .todo-item .code{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}

  /* đơn đăng ký */
  .dk{background:var(--trang);border:1px solid var(--vien);border-left:5px solid var(--cam);border-radius:var(--r);
    padding:15px 17px;margin-bottom:11px;box-shadow:var(--bong)}
  .dk.da-duyet{border-left-color:var(--ok)} .dk.tu-choi{border-left-color:var(--khong);opacity:.75}
  .dk-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .dk-top h3{font-size:16.5px;color:var(--cam-toi)}
  .dk-top .when{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-4)}
  .dk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:11px}
  .dk-grid .k{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)}
  .dk-grid .v{font-size:13.5px}
  .dk-hc{margin-top:11px;padding-top:11px;border-top:1px dashed var(--vien);font-size:13.5px;color:var(--ink-3);white-space:pre-wrap}
  .dk-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--vien);align-items:center}

  /* ca */
  .filters{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:15px}
  .chip{background:var(--trang);border:1.5px solid var(--vien);border-radius:var(--r-pill);padding:5px 14px;cursor:pointer;font-size:13px;font-weight:500}
  .chip[aria-pressed="true"]{background:var(--cam);border-color:var(--cam);color:#fff;font-weight:700}
  .batch{margin-bottom:26px}
  .batch-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 12px;margin-bottom:5px}
  .batch-head h3{font-size:16px;color:var(--cam-toi)}
  .batch-head .meta{font-family:var(--mono);font-size:11.5px;color:var(--cam-dam);font-weight:600}
  .batch-head .n{margin-left:auto;font-size:12px;color:var(--ink-4)}
  .batch-rule{height:7px;background:repeating-linear-gradient(to right,var(--cam-vien) 0 1px,transparent 1px 8px);margin-bottom:13px}
  .grid-cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(286px,1fr));gap:13px}
  .ccard{position:relative;display:block;width:100%;text-align:left;background:var(--trang);border:1px solid var(--vien);
    border-radius:var(--r);padding:15px 17px 14px;cursor:pointer;box-shadow:var(--bong);overflow:hidden}
  .ccard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--idle)}
  .ccard:hover{border-color:var(--cam-vien);transform:translateY(-2px)}
  .ccard.s-dong-hanh::before{background:var(--ok)}
  .ccard.s-xem-xet::before{background:var(--vang)}
  .ccard.s-khong-dat::before{background:var(--khong)}
  .ccard.s-cho::before{background:var(--cam-vien)}
  .ccard .code{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
  .ccard .nm{font-family:var(--dis);font-size:17px;font-weight:800;margin:1px 0 3px;color:var(--cam-toi);line-height:1.25}
  .ccard .place{font-size:13px;color:var(--ink-2);font-weight:500}
  .ccard .pill{position:static;display:inline-block;margin-bottom:5px}
  .ccard .measure{display:flex;gap:14px;margin-top:9px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
  .ccard .measure b{color:var(--ink);font-weight:600}
  .ccard .steps{display:flex;gap:2px;margin-top:12px}
  .ccard .steps i{height:5px;flex:1;background:var(--idle);border-radius:2px}
  .ccard .steps i.on{background:var(--cam)}
  .ccard .foot{display:flex;gap:8px;align-items:center;margin-top:10px;padding-top:9px;border-top:1px dashed var(--vien);font-size:12.5px;color:var(--ink-3)}
  .ccard .foot .due{color:var(--khong);font-weight:700}
  .ccard .live{color:var(--ok);font-weight:700}
  .pill{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:var(--r-pill);
    letter-spacing:.03em;white-space:nowrap;text-transform:uppercase;border:1px solid transparent}
  .p-dong-hanh{background:var(--ok-nen);color:var(--ok);border-color:var(--ok-vien)}
  .p-xem-xet{background:var(--cho-nen);color:var(--cho);border-color:var(--cho-vien)}
  .p-khong-dat{background:var(--khong-nen);color:var(--khong);border-color:var(--khong-vien)}
  .p-cho{background:var(--cam-nhat2);color:var(--cam-sau);border-color:var(--cam-vien)}
  .empty{background:var(--trang);border:1px dashed var(--cam-vien);border-radius:var(--r);padding:30px 20px;text-align:center;color:var(--ink-4)}

  /* hồ sơ 1 ca */
  .back{display:inline-flex;gap:7px;align-items:center;background:none;border:0;cursor:pointer;color:var(--cam-dam);font-weight:700;padding:0;margin-bottom:14px}
  .dossier{background:var(--trang);border:1px solid var(--vien);border-radius:26px;box-shadow:var(--noi);overflow:hidden;margin-bottom:22px}
  .dossier-top{padding:20px 22px 18px;background:linear-gradient(168deg,var(--vang-nhat) 0%,var(--cam-nhat2) 100%)}
  .dossier-top .code{font-family:var(--mono);font-size:11px;color:var(--cam-dam);font-weight:600}
  .dossier-top h1{font-size:28px;margin:3px 0 7px;color:var(--cam-toi)}
  .dossier-top .where{color:var(--ink-3);font-size:13.5px}
  .dossier-body{padding:17px 22px 20px}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
  .facts .k{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-4)}
  .facts .v{font-size:15px;font-weight:600;margin-top:1px}
  .facts .v.mono{font-family:var(--mono);font-weight:500}
  .note{margin-top:15px;padding-top:14px;border-top:1px solid var(--vien);font-size:13.5px;color:var(--ink-3);white-space:pre-wrap}
  .linkbox{margin-top:15px;padding:13px 15px;background:var(--vang-nhat);border:1px solid var(--vang-vien);border-radius:var(--r-sm)}
  .linkbox .lb-top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .linkbox input{flex:1 1 230px;font-family:var(--mono);font-size:12px;background:var(--trang);
    border:1px solid var(--vang-vien);border-radius:8px;padding:7px 10px}
  .gap{margin-top:16px;padding-top:15px;border-top:1px solid var(--vien)}
  .gap-row{margin-top:12px}
  .gap-lbl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:5px}
  .gap-lbl b{font-family:var(--mono);color:var(--ink)}
  .gap-bar{position:relative;height:22px;background:var(--cam-nhat2);border-radius:6px;overflow:hidden}
  .gap-bar .have{position:absolute;left:0;top:0;bottom:0;background:var(--cam);border-radius:6px 0 0 6px}
  .gap-bar .std{position:absolute;top:0;bottom:0;right:0;width:3px;background:var(--vang-chu)}
  .gap-miss{font-size:12px;color:var(--khong);margin-top:5px;font-weight:700}
  .tien-bo{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-top:11px}
  .ob{background:var(--cam-nhat);border:1px solid var(--vien);border-radius:var(--r-sm);padding:11px 13px}
  .ob.tot{background:var(--ok-nen);border-color:var(--ok-vien)}
  .ob .so{font-family:var(--dis);font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--cam-toi)}
  .ob.tot .so{color:var(--ok)}
  .ob .nh{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-4);margin-top:1px}
  .ob .ph{font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .tt-item{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--trang);border:1px solid var(--vien);
    border-radius:var(--r-sm);padding:10px 13px;margin-bottom:7px}
  .tt-item .kenh{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    background:var(--vang-nhat);color:var(--vang-chu);border:1px solid var(--vang-vien);border-radius:var(--r-pill);padding:2px 9px}
  .tt-item .td{font-weight:600;flex:1 1 200px}
  .tt-item .ng{font-family:var(--mono);font-size:11.5px;color:var(--ink-4)}
  .anh-hs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px;margin-top:10px}
  .anh-hs figure{margin:0;background:var(--cam-nhat);border:1px solid var(--vien);border-radius:var(--r-sm);overflow:hidden}
  .anh-hs img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--cam-nhat2)}
  .anh-hs figcaption{font-size:11px;color:var(--ink-4);padding:5px 8px;display:flex;gap:6px;align-items:center}
  .anh-hs figcaption button{margin-left:auto}
  .media{position:relative;margin:0;background:var(--cam-nhat);border:1px solid var(--vien);border-radius:var(--r-sm);overflow:hidden}
  .media img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--cam-nhat2)}
  .media.youtube img{aspect-ratio:16/9}
  .media a{display:block;position:relative}
  .media .dau{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .media figcaption{font-size:11.5px;color:var(--ink-4);padding:6px 9px;display:flex;gap:7px;align-items:center}
  .media figcaption button{margin-left:auto;padding:2px 9px;font-size:11.5px}
  .khung-link{display:flex;gap:9px;align-items:center;padding:16px 13px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:13px}
  .khung-link .bieu{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--vang-nhat);border:1px solid var(--vang-vien);flex:0 0 auto}
  .media.o-mang{background:var(--sunk,var(--cam-nhat2))}
  .media.o-mang .khung-link{cursor:default}
  .anh-bia{display:flex;gap:13px;align-items:flex-start;margin-top:13px}
  .anh-bia img{width:112px;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--vien)}
  .anh-trong{background:var(--cam-nhat);border:1px dashed var(--cam-vien);border-radius:var(--r-sm);
    padding:14px;text-align:center;font-size:12px;color:var(--ink-4)}
  /* thẻ con trong hồ sơ một bé */
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
  .subtab{background:var(--trang);border:1.5px solid var(--vien);border-radius:var(--r-pill);
    padding:8px 17px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-3)}
  .subtab:hover{border-color:var(--cam-vien)}
  .subtab[aria-pressed="true"]{background:var(--cam);border-color:var(--cam);color:#fff}
  .subtab .n{opacity:.7;font-weight:500;margin-left:4px}
  /* ảnh đại diện */
  .ava{flex:0 0 auto;width:62px;height:62px;border-radius:50%;object-fit:cover;border:2px solid var(--vang-vien);background:var(--cam-nhat2)}
  .ava-chu{display:flex;align-items:center;justify-content:center;font-family:var(--dis);font-weight:800;
    font-size:22px;color:var(--cam-dam)}

/* ===================== kho dữ liệu ===================== */
var SB=null, CHE_DO="mau", TOI=null, QUYEN={}, D={};
var KEY_MAU="keo-day-xem-thu";
function daCauHinh(){return !!(CAU_HINH.url&&CAU_HINH.anon_key);}
function mauLoad(){try{var r=localStorage.getItem(KEY_MAU);if(r)return JSON.parse(r);}catch(e){}return JSON.parse(JSON.stringify(MAU));}
function mauSave(){try{localStorage.setItem(KEY_MAU,JSON.stringify(D));}catch(e){}}

async function napTatCa(){
  if(CHE_DO==="mau"){D=mauLoad();return;}
  var yc=[
    SB.from("dot").select("*").order("thu_tu"),
    SB.from("ca_tom_tat").select("*").order("id").limit(1000),
    SB.from("nhom_quyen").select("*"),
    SB.from("vat_tu_dot").select("*"),
    SB.from("chuyen_vien").select("*").order("ten")
  ];
  if(QUYEN.duyet_dang_ky||!TOI)yc.push(SB.from("dang_ky").select("*").order("tao_luc",{ascending:false}).limit(300));
  else yc.push(Promise.resolve({data:[]}));
  if(QUYEN.quan_tri)yc.push(SB.from("nguoi_dung").select("*").order("ho_ten"));
  else yc.push(Promise.resolve({data:[]}));
  var t=await Promise.all(yc);
  D={dot:t[0].data||[], ca:t[1].data||[], nhom_quyen:t[2].data||[], vat_tu:t[3].data||[],
     chuyen_vien:t[4].data||[], dang_ky:t[5].data||[], nguoi_dung:t[6].data||[],
     moc:D.moc||[], xet_nghiem:D.xet_nghiem||[], tai_danh_gia:D.tai_danh_gia||[],
     lieu_trinh:D.lieu_trinh||[], truyen_thong:D.truyen_thong||[]};
}

/* Chi tiết một ca chỉ tải khi mở ca đó, để số ca tăng bao nhiêu cũng không nặng */
var daTai={};
async function napChiTiet(id, batBuoc){
  if(CHE_DO==="mau")return;
  if(daTai[id]&&!batBuoc)return;
  var t=await Promise.all([
    SB.from("moc").select("*").eq("ca_id",id),
    SB.from("xet_nghiem").select("*").eq("ca_id",id),
    SB.from("tai_danh_gia").select("*").eq("ca_id",id).order("ngay"),
    SB.from("lieu_trinh").select("*").eq("ca_id",id).order("tu_ngay"),
    SB.from("truyen_thong").select("*").eq("ca_id",id).order("ngay",{ascending:false})
  ]);
  var bo=function(bang){ D[bang]=(D[bang]||[]).filter(function(x){return x.ca_id!==id;}); };
  ["moc","xet_nghiem","tai_danh_gia","lieu_trinh","truyen_thong"].forEach(bo);
  D.moc=D.moc.concat(t[0].data||[]);
  D.xet_nghiem=D.xet_nghiem.concat(t[1].data||[]);
  D.tai_danh_gia=D.tai_danh_gia.concat(t[2].data||[]);
  D.lieu_trinh=D.lieu_trinh.concat(t[3].data||[]);
  D.truyen_thong=D.truyen_thong.concat(t[4].data||[]);
  daTai[id]=true;
}

async function lamMoi(){
  if(CHE_DO!=="that")return;
  await napTatCa();
  if(moCa)await napChiTiet(moCa,true);
}
async function ghi(bang,ban_ghi,khoa){
  if(CHE_DO==="mau"){
    var ds=D[bang]||(D[bang]=[]);
    var k=khoa&&khoa.indexOf(",")<0?khoa:"id";
    if(bang==="moc"&&!ban_ghi.id){
      var cu=ds.find(function(x){return x.ca_id===ban_ghi.ca_id&&x.khoa===ban_ghi.khoa;});
      if(cu)ban_ghi.id=cu.id;
    }
    var i=ds.findIndex(function(x){return x[k]!==undefined&&x[k]===ban_ghi[k];});
    if(i>=0)ds[i]=Object.assign({},ds[i],ban_ghi);
    else{if(ban_ghi[k]===undefined&&k==="id")ban_ghi.id=Date.now();ds.push(ban_ghi);}
    mauSave();return {ok:true};
  }
  var r=await SB.from(bang).upsert(ban_ghi,khoa?{onConflict:khoa}:undefined).select();
  return r.error?{ok:false,loi:r.error.message}:{ok:true,data:r.data};
}
async function xoa(bang,dieu_kien){
  if(CHE_DO==="mau"){
    var k=Object.keys(dieu_kien)[0];
    D[bang]=(D[bang]||[]).filter(function(x){return x[k]!==dieu_kien[k];});
    mauSave();return {ok:true};
  }
  var q=SB.from(bang).delete();
  Object.keys(dieu_kien).forEach(function(k){q=q.eq(k,dieu_kien[k]);});
  var r=await q;
  return r.error?{ok:false,loi:r.error.message}:{ok:true};
}

/* ===================== tiện ích ===================== */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(s){if(!s)return "";var a=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(a)return a[3]+"/"+a[2]+"/"+a[1];var b=/^(\d{4})-(\d{2})$/.exec(s);if(b)return b[2]+"/"+b[1];return s;}
function fmtGio(s){if(!s)return "";var d=new Date(s);if(isNaN(d))return s;
  return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function parseD(s){if(!s)return null;var a=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(a)return new Date(+a[1],+a[2]-1,+a[3]);var b=/^(\d{4})-(\d{2})$/.exec(s);if(b)return new Date(+b[1],+b[2]-1,15);return null;}
function khongDau(s){
  return String(s||"").toLowerCase()
    .replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g,"a").replace(/[èéẹẻẽêềếệểễ]/g,"e")
    .replace(/[ìíịỉĩ]/g,"i").replace(/[òóọỏõôồốộổỗơờớợởỡ]/g,"o")
    .replace(/[ùúụủũưừứựửữ]/g,"u").replace(/[ỳýỵỷỹ]/g,"y").replace(/đ/g,"d")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function num(v){var n=parseFloat(v);return isNaN(n)||n<=0?0:n;}
function getCa(id){return (D.ca||[]).find(function(c){return c.id===id;});}
function getDot(ma){return (D.dot||[]).find(function(d){return d.ma===ma;})||{ten:ma||"",khi:"",dia_ban:"",doi_ngu:"",ket_qua:""};}
function mocCua(ca_id,khoa){return (D.moc||[]).find(function(m){return m.ca_id===ca_id&&m.khoa===khoa;});}
function dsCua(bang,ca_id){return (D[bang]||[]).filter(function(x){return x.ca_id===ca_id;});}
function thayMoc(c,st){
  if(st.kin&&!QUYEN.xem_nhay_cam)return false;
  if(st.list)return dsCua(st.list,c.id).length>0;
  var m=mocCua(c.id,st.k);return !!(m&&(m.ngay||m.noi_dung));
}
function demMoc(c){var n=0;STAGES.forEach(function(st){if(thayMoc(c,st))n++;});return n;}
function mocCuoi(c){var f=null;STAGES.forEach(function(st){if(thayMoc(c,st))f=st;});return f;}
function hanDoLai(c){
  if(c.trang_thai!=="dong-hanh")return null;
  var base=null;
  dsCua("tai_danh_gia",c.id).forEach(function(r){var d=parseD(r.ngay);if(d&&(!base||d>base))base=d;});
  if(!base&&c.do_lai_gan_nhat)base=parseD(c.do_lai_gan_nhat);
  if(!base){var g=mocCua(c.id,"giao-hang");base=g?parseD(g.ngay):(c.ngay_trao?parseD(c.ngay_trao):null);}
  if(!base)return null;
  var late=Math.round((new Date()-new Date(base.getTime()+90*86400000))/86400000);
  if(late>0)return {txt:"Quá hạn đo lại "+late+" ngày",bad:true};
  if(late>-21)return {txt:"Tới hạn đo lại trong "+(-late)+" ngày",bad:false};
  return null;
}
function linkCongKhai(c){return CAU_HINH.goc_cong_khai+"/"+(c.slug||khongDau(c.ten));}

/* Nhận ra link thuộc loại nào để hiện cho đúng: ảnh, YouTube, Facebook, hay đường dẫn ổ mạng */
function loaiLink(u){
  u=String(u||"").trim();
  if(!u)return {loai:"trong"};
  if(/^(Z:|[A-Z]:\\|\\\\|file:)/i.test(u))return {loai:"o-mang", ten:u.split(/[\\/]/).pop()||u};
  var yt=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_\-]{6,})/);
  if(yt)return {loai:"youtube", ma:yt[1], anh:"https://img.youtube.com/vi/"+yt[1]+"/hqdefault.jpg"};
  if(/facebook\.com|fb\.watch/i.test(u))return {loai:"facebook", ten:"Facebook"};
  if(/\.(jpe?g|png|webp|gif|avif)(\?|#|$)/i.test(u))return {loai:"anh"};
  if(/^https?:/i.test(u))return {loai:"web", ten:u.replace(/^https?:\/\//,"").split("/")[0]};
  return {loai:"khac", ten:u};
}

/* Một ô media: ảnh thì hiện ảnh, YouTube thì hiện hình đại diện, ổ mạng thì hiện đường dẫn chép được */
function oMedia(u, nhan, nutXoa){

  if(k.loai==="anh")than='<img src="'+esc(u)+'" alt="'+esc(nhan||"Ảnh hồ sơ")+'" loading="lazy">';

  else if(k.loai==="facebook")than='<a class="khung-link" href="'+esc(u)+'" target="_blank" rel="noopener"><span class="bieu">f</span><span>Bài trên Facebook</span></a>';
  else if(k.loai==="o-mang")than='<span class="khung-link o-mang" title="'+esc(u)+'"><span class="bieu">🗂</span><span>'+esc(k.ten)+'</span></span>';
  else than='<a class="khung-link" href="'+esc(u)+'" target="_blank" rel="noopener"><span class="bieu">↗</span><span>'+esc(k.ten||u)+'</span></a>';

/* Tính tiến bộ từ các lần đo lại so với số nền lúc nhận hồ sơ */
function tienBo(c){
  var lan=dsCua("tai_danh_gia",c.id).filter(function(r){return parseD(r.ngay);});
  if(!lan.length||!num(c.cao))return null;
  lan.sort(function(a,b){return parseD(a.ngay)-parseD(b.ngay);});
  var cuoi=lan[lan.length-1];
  var nen=parseD(c.ngay_nen)||parseD((mocCua(c.id,"giao-hang")||{}).ngay)||parseD((mocCua(c.id,"phac-do")||{}).ngay);
  var thang=nen?Math.max(1,Math.round((parseD(cuoi.ngay)-nen)/86400000/30.44)):null;
  var tangCao=num(cuoi.cao)?Math.round((cuoi.cao-c.cao)*10)/10:null;
  var tangNang=num(cuoi.nang)?Math.round((cuoi.nang-c.nang)*10)/10:null;
  var thuHep=(num(c.thieu_cao)&&cuoi.thieu_cao!=null)?Math.round((c.thieu_cao-cuoi.thieu_cao)*10)/10:null;
  return {so_lan:lan.length,lan_cuoi:cuoi,thang:thang,tang_cao:tangCao,tang_nang:tangNang,
          toc_do:(tangCao!=null&&thang)?Math.round(tangCao/thang*100)/100:null,
          thu_hep:thuHep,chuoi:lan};
}

async function vaoHeThong(){
  var em=document.getElementById("em").value.trim();
  var mk=document.getElementById("mk").value;
  if(!em||!mk){loi("Nhập email và mật khẩu.");return;}
  var btn=document.getElementById("goBtn");

  try{

      TOI={email:em,ho_ten:"Người xem thử",nhom:"quan-tri"};

      if(r.error)throw new Error(r.error.message==="Invalid login credentials"?"Email hoặc mật khẩu chưa đúng.":r.error.message);
      var hs=await SB.from("nguoi_dung").select("*").eq("id",r.data.user.id).single();
      if(hs.error||!hs.data)throw new Error("Tài khoản chưa có hồ sơ trong hệ thống. Nhờ quản trị kiểm tra lại.");

function anhTron(c,cls){
  if(c.anh_bia&&loaiLink(c.anh_bia).loai==="anh")return '<img class="ava '+(cls||"")+'" src="'+esc(c.anh_bia)+'" alt="">';
  if(c.anh_bia&&loaiLink(c.anh_bia).loai==="youtube")return '<img class="ava '+(cls||"")+'" src="'+esc(loaiLink(c.anh_bia).anh)+'" alt="">';
  var ch=(String(c.ten||"?").trim().split(/\s+/).pop()||"?").charAt(0).toUpperCase();
  return '<div class="ava ava-chu '+(cls||"")+'" aria-hidden="true">'+esc(ch)+'</div>';
}
function the(c){
  var t=TT[c.trang_thai]||TT["cho"];
  var xong=(CHE_DO==="that"&&c.so_moc!=null)?Number(c.so_moc):demMoc(c);
  var hd=hanDoLai(c),bars="";
  for(var i2=0;i2<STAGES.length;i2++)bars+='<i class="'+(i2<xong?"on":"")+'"></i>';
  var so=(num(c.cao)?c.cao+" cm":"")+(num(c.cao)&&num(c.nang)?" · ":"")+(num(c.nang)?String(c.nang).replace(".",",")+" kg":"");
  return '<button class="ccard s-'+t.cls+'" data-ca="'+esc(c.id)+'">'+anhTron(c)+
    '<span class="than">'+
    '<span class="pill p-'+t.cls+'">'+esc(t.nhan)+'</span>'+
    '<div class="nm">'+esc(c.ten)+'</div>'+
    '<div class="place">'+esc(c.dia_ban||"")+'</div>'+
    '<div class="measure">'+(so?esc(so):'<span style="color:var(--ink-4)">chưa có số đo nền</span>')+'</div>'+
    '<div class="steps">'+bars+'</div>'+
    '<div class="foot"><span class="num">'+xong+'/'+STAGES.length+' mốc</span>'+
    (hd?'<span class="due" style="margin-left:auto">⚑ '+esc(hd.txt)+'</span>':(c.cong_khai?'<span class="live" style="margin-left:auto">● công khai</span>':''))+
    '</div></span></button>';
}

/* ===================== một ca ===================== */
function trangCa(id){
  var c=getCa(id);
  if(!c)return '<div class="empty">Không tìm thấy ca này.</div>';
  var t=TT[c.trang_thai]||TT["cho"],d=getDot(c.dot),xong=demMoc(c),hd=hanDoLai(c);

  var h='<button class="back" data-back="1">&larr; Danh sách hồ sơ ca</button>'+
   '<div class="dossier"><div class="dossier-top">'+anhTron(c)+
   '<div class="than"><div class="code">'+esc(c.id)+' · '+esc(d.ten)+'</div>'+
   '<h1>'+esc(c.ten)+'</h1><div class="where">'+esc(c.dia_ban||"")+(c.tuoi?' · '+esc(c.tuoi):'')+'</div>'+
   '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px">'+
   '<span class="pill p-'+t.cls+'">'+esc(t.nhan)+'</span>'+
   '<span class="hint num">'+xong+'/'+STAGES.length+' mốc</span>'+
   (c.cong_khai?'<span class="pill p-dong-hanh">● link công khai đang bật</span>':'')+
   (hd?'<span class="pill '+(hd.bad?"p-khong-dat":"p-xem-xet")+'">'+esc(hd.txt)+'</span>':'')+
   '</div></div></div><div class="ruler"></div></div>';

  var soAnh=((c.anh_ho_so&&c.anh_ho_so.length)||0)+(c.anh_bia?1:0);
  var soBai=(D.truyen_thong||[]).filter(function(x){return x.ca_id===c.id;}).length;
  var soLT=(D.lieu_trinh||[]).filter(function(x){return x.ca_id===c.id;}).length;
  var tabs=[["thong-tin","Thông tin bé",""],["hanh-trinh","Hành trình",xong+"/"+STAGES.length],
            ["lieu-trinh","Liệu trình",soLT?String(soLT):""],["tu-lieu","Ảnh và bài đăng",(soAnh+soBai)?String(soAnh+soBai):""]];
  h+='<div class="subtabs">'+tabs.map(function(x){
    return '<button class="subtab" data-tabca="'+x[0]+'" aria-pressed="'+(tabCa===x[0])+'">'+esc(x[1])+
      (x[2]?'<span class="n">'+esc(x[2])+'</span>':'')+'</button>';
  }).join("")+'</div>';

  if(tabCa==="thong-tin")h+=phanThongTin(c,d);
  else if(tabCa==="hanh-trinh")h+=phanHanhTrinh(c);
  else if(tabCa==="lieu-trinh")h+=khoiLieuTrinh(c);
  else h+=phanTuLieu(c);
  return h;
}

/* ---------- thẻ con: thông tin bé ---------- */
function phanThongTin(c,d){
  var h='<section class="card card-pad" style="margin-bottom:18px">'+
   '<div class="facts">'+fc("Đợt",d.ten)+fc("Địa bàn",c.dia_ban)+
   fc("Tuổi",c.tuoi)+fc("Giới tính",c.gioi_tinh)+fc("Ngày sinh",c.ngay_sinh?fmt(String(c.ngay_sinh)):"",1)+
   fc("Chiều cao nền",num(c.cao)?c.cao+" cm":"",1)+fc("Cân nặng nền",num(c.nang)?String(c.nang).replace(".",",")+" kg":"",1)+
   fc("Dự đoán tuổi 20",num(c.du_doan_20)?String(c.du_doan_20).replace(".",",")+" cm":"",1)+
   fc("Cao bố / mẹ",(num(c.cao_bo)||num(c.cao_me))?((num(c.cao_bo)?c.cao_bo:"?")+" / "+(num(c.cao_me)?c.cao_me:"?")+" cm"):"",1)+
   fc("Người nuôi",c.nguoi_nuoi)+fc("Chuyên viên đề xuất",c.de_xuat_boi)+'</div>';
  if(c.ghi_chu)h+='<div class="note">'+esc(c.ghi_chu)+'</div>';

  if(num(c.chuan_cao)&&num(c.cao))h+='<div class="gap"><div class="eyebrow">So với chuẩn lúc nhận hồ sơ'+
    (c.muc_cao?' · '+esc(c.muc_cao):'')+'</div>'+
    thanh("Chiều cao",c.cao,c.chuan_cao,"cm")+(num(c.chuan_nang)&&num(c.nang)?thanh("Cân nặng",c.nang,c.chuan_nang,"kg"):"")+'</div>';

  var tb=tienBo(c);
  h+='<div class="gap"><div class="eyebrow">Tiến bộ sau khi đồng hành</div>';
  if(!tb){
    h+='<p class="hint" style="margin-top:8px">Chưa có lần đo lại nào. Chuyên môn nhập ở thẻ Hành trình, mốc 09, hệ thống sẽ tự tính mức tăng, tốc độ mỗi tháng và phần thu hẹp so với chuẩn.</p>';
  }else{
    h+='<div class="tien-bo">'+
      ob(tb.tang_cao!=null?(tb.tang_cao>0?"+":"")+String(tb.tang_cao).replace(".",",")+" cm":"—","Tăng chiều cao",
         tb.thang?("sau "+tb.thang+" tháng"):"",tb.tang_cao>0)+
      ob(tb.tang_nang!=null?(tb.tang_nang>0?"+":"")+String(tb.tang_nang).replace(".",",")+" kg":"—","Tăng cân nặng","",tb.tang_nang>0)+
      ob(tb.toc_do!=null?String(tb.toc_do).replace(".",",")+" cm":"—","Mỗi tháng",
         (tb.toc_do!=null?(tb.toc_do>=0.5?"đạt nhịp mong đợi":"chậm hơn mong đợi"):""),tb.toc_do>=0.5)+
      ob(tb.thu_hep!=null?(tb.thu_hep>0?"-":"")+String(Math.abs(tb.thu_hep)).replace(".",",")+" cm":"—","Khoảng cách tới chuẩn",
         tb.thu_hep>0?"đã thu hẹp":(tb.thu_hep<0?"còn giãn ra":""),tb.thu_hep>0)+'</div>';
    h+='<div class="rows" style="margin-top:11px">'+tb.chuoi.map(function(r){
      var v=[r.cao?String(r.cao).replace(".",",")+" cm":"",r.nang?String(r.nang).replace(".",",")+" kg":"",
             r.thieu_cao!=null?"còn thiếu "+String(r.thieu_cao).replace(".",",")+" cm":"",
             r.dieu_chinh||""].filter(Boolean).join(" · ");
      return '<div class="rw"><span class="rd">'+fmt(r.ngay)+'</span><span class="rt">'+esc(r.moc_do||"Đo lại")+'</span>'+
        '<span class="rv">'+esc(v)+'</span></div>';
    }).join("")+'</div>';
  }
  h+='</div>';

  h+='<div class="linkbox"><div class="eyebrow">Link riêng theo dõi hành trình</div>'+
    '<div class="lb-top"><input type="text" readonly value="'+esc(linkCongKhai(c))+'" aria-label="Link công khai">'+
    '<button class="btn btn-sm" data-chep="'+esc(linkCongKhai(c))+'">Chép link</button>'+
    (QUYEN.cong_khai?'<label class="sw"><input type="checkbox" data-ck-ca="'+esc(c.id)+'"'+(c.cong_khai?" checked":"")+'> Bật công khai</label>':'')+
    '</div><p class="hint" style="margin-top:7px">'+
    (c.cong_khai?"Link đang chạy, gắn được vào trang giới thiệu và dùng cho truyền thông. Chỉ các mốc đã bật công khai mới hiện ra ngoài."
                :"Link chưa bật. Người ngoài mở vào sẽ không thấy gì.")+'</p></div>';

  if(suaCM()||suaTT()){
    if(oMo!=="ca"){
      h+='<button class="mo-sua" data-mo="ca">✎ Sửa thông tin bé</button>';
    }else{
      h+='<div class="edit"><div class="frow">'+
        ip("fTen","Tên bé",c.ten)+ip("fTuoi","Tuổi",c.tuoi)+ip("fSlug","Đường dẫn riêng",c.slug||khongDau(c.ten))+
        ip("fCao","Chiều cao",num(c.cao)?c.cao:"")+ip("fNang","Cân nặng",num(c.nang)?c.nang:"")+
        ip("fCCao","Chuẩn WHO cao",num(c.chuan_cao)?c.chuan_cao:"")+ip("fCNang","Chuẩn WHO nặng",num(c.chuan_nang)?c.chuan_nang:"")+
        ip("fDiaBan","Địa bàn",c.dia_ban)+ip("fBy","Chuyên viên đề xuất",c.de_xuat_boi)+
        '<select id="fTT" aria-label="Trạng thái">'+Object.keys(TT).map(function(k){
          return '<option value="'+k+'"'+(c.trang_thai===k?" selected":"")+'>'+TT[k].nhan+'</option>';}).join("")+'</select>'+
        '<select id="fDot" aria-label="Đợt">'+(D.dot||[]).map(function(x){
          return '<option value="'+esc(x.ma)+'"'+(c.dot===x.ma?" selected":"")+'>'+esc(x.ten)+'</option>';}).join("")+'</select>'+
        '</div>'+
        '<textarea id="fGT" placeholder="Giới thiệu ngắn, dùng cho trang công khai của bé" aria-label="Giới thiệu">'+esc(c.gioi_thieu||"")+'</textarea>'+
        '<textarea id="fNote" placeholder="Ghi chú nội bộ, không ra trang công khai" aria-label="Ghi chú nội bộ">'+esc(c.ghi_chu||"")+'</textarea>'+
        '<div class="acts"><button class="btn btn-main" data-luuca="'+esc(c.id)+'">Lưu</button>'+
        '<button class="btn" data-mo="">Thôi</button>'+
        (duocXoa()?'<button class="btn btn-bad" data-delcase="'+esc(c.id)+'" style="margin-left:auto">Xoá hồ sơ này</button>':'')+
        '<span class="msg" id="msgCa"></span></div></div>';
    }
  }
  return h+'</section>';
}

/* ---------- thẻ con: hành trình ---------- */
function phanHanhTrinh(c){
  var cho=-1;
  for(var k2=0;k2<STAGES.length;k2++){if(!thayMoc(c,STAGES[k2])){cho=k2;break;}}
  var h='<section class="sec"><div class="sec-head"><h2>Hành trình</h2>'+
    '<span class="sub">10 mốc theo luồng chuyên môn</span></div><div class="journey">';
  STAGES.forEach(function(st,idx){
    var khoaO="moc:"+st.k;
    if(st.kin&&!QUYEN.xem_nhay_cam){
      h+='<div class="stage gon"><span class="no">'+String(idx+1).padStart(2,"0")+'</span><span class="mk"></span>'+
         '<div class="sbox"><div class="stop"><h3>'+esc(st.t)+' · nhóm quyền của anh chị không xem được</h3></div></div></div>';
      return;
    }
    var m=st.list?null:mocCua(c.id,st.k), ds=st.list?dsCua(st.list,c.id):[];
    var coDL=thayMoc(c,st);
    var duocSua=(st.k==="tu-lieu")?suaTT():suaCM();
    var dangSua=(oMo===khoaO);
    var cls=coDL?"done":(idx===cho?"now":"todo");
    if(!coDL&&idx!==cho&&!dangSua)cls="gon";

    h+='<div class="stage '+cls+'"><span class="no">'+String(idx+1).padStart(2,"0")+'</span><span class="mk"></span><div class="sbox">'+
      '<div class="stop"><h3>'+esc(st.t)+'</h3>'+(m&&m.ngay?'<span class="d">'+fmt(m.ngay)+'</span>':'')+'</div>';
    if(cls!=="gon"){
      h+='<div class="swho">'+esc(st.who)+'</div>';
      if(m&&m.noi_dung)h+='<div class="sbody">'+esc(m.noi_dung)+'</div>';
      else if(!ds.length)h+='<div class="swait">'+esc(st.wait)+'</div>';
      if(m&&(m.noi_dung||m.ngay)){
        h+='<div class="tags">'+(st.kin?'<span class="tag tag-kin">Khoá, không ra ngoài</span>'
          :'<span class="tag '+(m.cong_khai?"tag-live":"tag-kin")+'">'+(m.cong_khai?"Hiện trên link công khai":"Chỉ nội bộ")+'</span>')+'</div>';
      }
      if(ds.length){
        h+='<div class="rows">'+ds.map(function(r){
          var v=r.ket_qua||[r.cao?String(r.cao).replace(".",",")+" cm":"",r.nang?String(r.nang).replace(".",",")+" kg":"",
              r.thieu_cao!=null?"còn thiếu "+String(r.thieu_cao).replace(".",",")+" cm":"",r.dieu_chinh||""].filter(Boolean).join(" · ");
          return '<div class="rw"><span class="rd">'+fmt(r.ngay)+'</span><span class="rt">'+esc(r.loai||r.moc_do||"")+'</span>'+
            '<span class="rv">'+esc(v)+'</span>'+
            (duocSua&&dangSua&&duocXoa()?'<button class="btn btn-sm btn-bad" data-xoadong="'+st.list+'" data-rid="'+r.id+'">Xoá</button>':'')+'</div>';
        }).join("")+'</div>';
      }
      if(m&&m.anh&&m.anh.length){
        h+='<div class="links">'+m.anh.map(function(u){
          var k=loaiLink(u);
          var nhan=k.loai==="youtube"?"Video YouTube":(k.loai==="facebook"?"Bài Facebook":(k.loai==="o-mang"?k.ten:(k.ten||"link")));
          if(k.loai==="o-mang")return '<span style="background:var(--cam-nhat);border:1px solid var(--vien);border-radius:9px;padding:6px 11px;font-size:12.5px">🗂 '+esc(nhan)+'</span>';
          return '<a href="'+esc(u)+'" target="_blank" rel="noopener">↗ '+esc(nhan)+'</a>';}).join("")+'</div>';
      }
    }
    if(duocSua){
      if(!dangSua){
        h+='<button class="mo-sua" data-mo="'+khoaO+'">'+(st.list?"✎ Thêm hoặc sửa":(coDL?"✎ Sửa mốc này":"✎ Nhập mốc này"))+'</button>';
      }else if(st.list){
        h+='<div class="edit"><div class="frow">'+
          '<input type="date" data-nr="ngay" aria-label="Ngày">'+
          '<input type="text" data-nr="loai" placeholder="'+(st.list==="xet_nghiem"?"Loại xét nghiệm":"Mốc đo, ví dụ sau 3 tháng")+'" aria-label="Loại">'+
          (st.list==="tai_danh_gia"?'<input type="text" data-nr="cao" placeholder="Cao (cm)" aria-label="Cao">'+
            '<input type="text" data-nr="nang" placeholder="Nặng (kg)" aria-label="Nặng">'+
            '<input type="text" data-nr="thieu_cao" placeholder="Còn thiếu (cm)" aria-label="Còn thiếu bao nhiêu cm">':'')+
          '<input type="text" data-nr="ket_qua" placeholder="'+(st.list==="xet_nghiem"?"Kết quả":"Điều chỉnh phác đồ")+'" aria-label="Kết quả">'+
          '</div><div class="acts"><button class="btn btn-main btn-sm" data-themdong="'+st.list+'" data-cid="'+esc(c.id)+'">Thêm dòng</button>'+
          '<button class="btn btn-sm" data-mo="">Xong</button></div></div>';
      }else{
        h+='<div class="edit two">'+
          '<input type="date" data-mf="ngay" value="'+esc(m&&m.ngay&&m.ngay.length>=10?String(m.ngay).slice(0,10):"")+'" aria-label="Ngày">'+
          '<textarea data-mf="noi_dung" placeholder="Nội dung mốc này" aria-label="Nội dung">'+esc((m&&m.noi_dung)||"")+'</textarea>'+
          '<input type="text" data-mf="anh" value="'+esc(m&&m.anh?m.anh.join(", "):"")+'" placeholder="Link ảnh, video, cách nhau bằng dấu phẩy" aria-label="Tư liệu" style="grid-column:1/-1">'+
          '<div class="acts"><button class="btn btn-main btn-sm" data-luumoc="'+st.k+'" data-cid="'+esc(c.id)+'">Lưu mốc</button>'+
          '<button class="btn btn-sm" data-mo="">Thôi</button>'+
          (QUYEN.cong_khai&&!st.kin?'<label class="sw"><input type="checkbox" data-mf="cong_khai"'+(m&&m.cong_khai?" checked":"")+'> Hiện trên link công khai</label>':'')+
          '</div></div>';
      }
    }
    h+='</div></div>';
  });
  return h+'</div></section>';
}

/* ---------- thẻ con: liệu trình ---------- */
function khoiLieuTrinh(c){
  var ds=(D.lieu_trinh||[]).filter(function(x){return x.ca_id===c.id;});
  var nhom={};
  ds.forEach(function(r){var k=r.dot_phac_do||"ban đầu";(nhom[k]=nhom[k]||[]).push(r);});
  var dangSua=(oMo==="lt");
  var h='<section class="sec"><div class="sec-head"><h2>Liệu trình</h2>'+
    '<span class="sub">chuyên môn nhập và điều chỉnh theo mốc đo lại</span></div><div class="card card-pad">';
  if(c.phac_do&&!ds.length)h+='<div class="note" style="margin-top:0;border:0;padding-top:0"><b>Phác đồ một tháng:</b> '+esc(c.phac_do)+'</div>';
  if(!ds.length&&!c.phac_do)h+='<p class="hint">Chưa có liệu trình. '+(suaCM()?"Bấm nút dưới để nhập từng sản phẩm.":"Chờ chuyên môn nhập.")+'</p>';
  Object.keys(nhom).forEach(function(k){
    h+='<div style="margin-bottom:13px"><div class="eyebrow">Phác đồ '+esc(k)+'</div>'+
      '<div class="tbl-wrap" style="margin-top:7px"><table class="tbl"><thead><tr><th>Sản phẩm</th><th>Liều</th><th>Số lượng</th><th>Từ ngày</th>'+
      (suaCM()&&dangSua&&duocXoa()?'<th></th>':'')+'</tr></thead><tbody>'+
      nhom[k].map(function(r){
        return '<tr><td><b>'+esc(r.san_pham)+'</b>'+(r.ghi_chu?'<div class="hint">'+esc(r.ghi_chu)+'</div>':'')+'</td>'+
          '<td>'+esc(r.lieu||"—")+'</td><td>'+esc(r.so_luong||"—")+'</td>'+
          '<td class="mono">'+esc(r.tu_ngay?fmt(String(r.tu_ngay)):"—")+'</td>'+
          (suaCM()&&dangSua&&duocXoa()?'<td><button class="btn btn-sm btn-bad" data-xoalt="'+r.id+'">Xoá</button></td>':'')+'</tr>';
      }).join("")+'</tbody></table></div></div>';
  });
  if(suaCM()){
    if(!dangSua)h+='<button class="mo-sua" data-mo="lt">✎ Thêm hoặc sửa liệu trình</button>';
    else h+='<div class="edit"><div class="frow">'+
      '<input type="text" data-lt="san_pham" placeholder="Sản phẩm" aria-label="Sản phẩm">'+
      '<input type="text" data-lt="lieu" placeholder="Liều, ví dụ 3 ống/ngày" aria-label="Liều">'+
      '<input type="text" data-lt="so_luong" placeholder="Số lượng, ví dụ 3 hộp" aria-label="Số lượng">'+
      '<input type="date" data-lt="tu_ngay" aria-label="Từ ngày">'+
      '<input type="text" data-lt="dot_phac_do" placeholder="Đợt phác đồ, ví dụ sau 3 tháng" aria-label="Đợt phác đồ">'+
      '</div><div class="acts"><button class="btn btn-main" data-themlt="'+esc(c.id)+'">Thêm vào liệu trình</button>'+
      '<button class="btn" data-mo="">Xong</button></div></div>';
  }
  return h+'</div></section>';
}

/* ---------- thẻ con: ảnh và bài đăng ---------- */
function phanTuLieu(c){
  var dsAnh=(c.anh_ho_so&&c.anh_ho_so.length)?c.anh_ho_so:[];
  var h='<section class="sec"><div class="sec-head"><h2>Ảnh hồ sơ</h2>'+
    '<span class="sub">ảnh đại diện ra link công khai, ảnh hồ sơ thì không</span></div><div class="card card-pad">';
  if(c.anh_bia||dsAnh.length){
    if(c.anh_bia)h+='<div class="anh-bia">'+(loaiLink(c.anh_bia).loai==="anh"?'<img src="'+esc(c.anh_bia)+'" alt="Ảnh đại diện của bé">':'<div style="width:112px">'+oMedia(c.anh_bia,"ảnh đại diện")+'</div>')+
      '<div><div class="hint"><b>Ảnh đại diện</b></div>'+

/* ---------- tổng hợp vật tư mang đi, cộng từ liệu trình ---------- */
function khoiVatTu(){
  var h='<section class="sec"><div class="sec-head"><h2>Vật tư mang đi</h2>'+
    '<span class="sub">cộng tự động từ liệu trình của từng bé</span></div>';
  var co=false;
  (D.dot||[]).forEach(function(d){
    var dong;
    if(CHE_DO==="that"){
      dong=(D.vat_tu||[]).filter(function(v){return v.dot===d.ma;})
        .map(function(v){return {sp:v.san_pham,be:Number(v.so_be),sl:String(v.cac_so_luong||"").split(" | ").filter(Boolean)};});
    }else{
      var ids=(D.ca||[]).filter(function(c){return c.dot===d.ma;}).map(function(c){return c.id;});
      var gom={};
      (D.lieu_trinh||[]).filter(function(r){return ids.indexOf(r.ca_id)>=0;}).forEach(function(r){
        var g=gom[r.san_pham]||(gom[r.san_pham]={be:{},sl:[]});
        g.be[r.ca_id]=1; if(r.so_luong)g.sl.push(r.so_luong);
      });
      dong=Object.keys(gom).map(function(k){return {sp:k,be:Object.keys(gom[k].be).length,sl:gom[k].sl};});
    }
    if(!dong.length)return;
    co=true;
    dong.sort(function(a,b){return a.sp.localeCompare(b.sp,'vi');});
    var soBe=(D.ca||[]).filter(function(c){return c.dot===d.ma;}).length;
    h+='<div class="card card-pad" style="margin-bottom:13px"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">'+
      '<h3 style="font-size:16px;color:var(--cam-toi)">'+esc(d.ten)+'</h3>'+
      '<span class="hint" style="margin-left:auto">'+soBe+' bé</span></div>'+
      '<div class="tbl-wrap" style="margin-top:9px"><table class="tbl"><thead><tr><th>Sản phẩm</th><th>Số bé</th><th>Cần chuẩn bị</th></tr></thead><tbody>'+
      dong.map(function(x){
        return '<tr><td><b>'+esc(x.sp)+'</b></td><td class="num">'+x.be+'</td><td>'+esc(dem(x.sl))+'</td></tr>';
      }).join("")+'</tbody></table></div></div>';
  });
  if(!co)h+='<div class="empty">Chưa có liệu trình nào để cộng.</div>';
  return h+'</section>';
}
/* cộng các chuỗi kiểu "3 hộp", "1 bộ" thành "24 hộp" */
function dem(ds){
  var tong={};
  ds.forEach(function(x){
    var m=/^\s*(\d+(?:[.,]\d+)?)\s*(.*)$/.exec(String(x||""));
    if(!m){if(x)tong[x]=(tong[x]||0);return;}
    var dv=(m[2]||"").trim()||"cái";
    tong[dv]=(tong[dv]||0)+parseFloat(m[1].replace(",","."));
  });
  var ra=Object.keys(tong).map(function(dv){return tong[dv]?(tong[dv]+" "+dv):dv;});
  return ra.join(" · ")||"—";
}

  }
  if(t.hasAttribute("data-back")){moCa=null;trang="ho-so";window.scrollTo(0,0);return ve();}
  if(t.hasAttribute("data-loc")){loc=t.getAttribute("data-loc");return ve();}
  if(t.hasAttribute("data-locdk")){locDK=t.getAttribute("data-locdk");return ve();}
  if(t.hasAttribute("data-chep")){
    var link=t.getAttribute("data-chep");
    try{await navigator.clipboard.writeText(link);var cu=t.textContent;t.textContent="Đã chép";
        setTimeout(function(){t.textContent=cu;},1500);}
    catch(e){window.prompt("Chép đường dẫn này:",link);}
    return;
  }
  if(t.hasAttribute("data-daxem")||t.hasAttribute("data-tuchoi")){
    var id1=+(t.getAttribute("data-daxem")||t.getAttribute("data-tuchoi"));
    await ghi("dang_ky",{id:id1,trang_thai:t.hasAttribute("data-daxem")?"da-xem":"tu-choi"});
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-duyet")){
    var dkid=+t.getAttribute("data-duyet");
    var dk=(D.dang_ky||[]).find(function(x){return x.id===dkid;});
    if(!dk)return;
    var sel=document.querySelector('[data-dot-dk="'+dkid+'"]');
    var maDot=sel?sel.value:"DL";
    var soCa=(D.ca||[]).filter(function(c){return c.dot===maDot;}).length+1;
    var caMoi={id:"KD-"+maDot+"-"+String(soCa).padStart(2,"0"),
      slug:khongDau(dk.ho_ten_tre||("ca-"+dkid)),ten:dk.ho_ten_tre||"Chưa rõ tên",
      tuoi:dk.ngay_sinh?("sinh "+dk.ngay_sinh):"",dia_ban:dk.dia_chi||"",dot:maDot,
      de_xuat_boi:(dk.nguoi_gui||"")+(dk.quan_he?" ("+dk.quan_he+")":""),
      trang_thai:"xem-xet",cong_khai:false,ghi_chu:dk.hoan_canh||""};
    var r1=await ghi("ca",caMoi);
    if(!r1.ok){alert("Không tạo được hồ sơ: "+r1.loi);return;}
    await ghi("moc",{ca_id:caMoi.id,khoa:"de-xuat",ngay:String(dk.tao_luc||"").slice(0,10),
      noi_dung:"Đơn đăng ký gửi từ trang giới thiệu"+(dk.nguoi_gui?", người gửi: "+dk.nguoi_gui:"")+".",
      anh:[],cong_khai:false,nhay_cam:false},"ca_id,khoa");
    await ghi("dang_ky",{id:dkid,trang_thai:"da-duyet",ca_id:caMoi.id});
    await lamMoi();
    moCa=caMoi.id;window.scrollTo(0,0);
    return ve();
  }
  if(t.id==="addCase"){
    var ten=document.getElementById("newName").value.trim();
    if(!ten){document.getElementById("newName").focus();return;}
    var md=document.getElementById("newBatch").value;
    var k3=(D.ca||[]).filter(function(c){return c.dot===md;}).length+1;
    await ghi("ca",{id:"KD-"+md+"-"+String(k3).padStart(2,"0"),slug:khongDau(ten),ten:ten,
      dia_ban:document.getElementById("newPlace").value.trim(),dot:md,
      de_xuat_boi:document.getElementById("newBy").value.trim(),trang_thai:"xem-xet",cong_khai:false});
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-luuca")){
    var cid=t.getAttribute("data-luuca");
    var g=function(id){var e=document.getElementById(id);return e?e.value.trim():"";};
    var gn=function(id){return num(g(id).replace(",","."));};
    var r2=await ghi("ca",{id:cid,ten:g("fTen"),tuoi:g("fTuoi"),slug:khongDau(g("fSlug")||g("fTen")),
      cao:gn("fCao")||null,nang:gn("fNang")||null,chuan_cao:gn("fCCao")||null,chuan_nang:gn("fCNang")||null,
      dia_ban:g("fDiaBan"),de_xuat_boi:g("fBy"),trang_thai:document.getElementById("fTT").value,
      dot:document.getElementById("fDot").value,gioi_thieu:g("fGT"),ghi_chu:g("fNote")});
    await lamMoi();
    ve();
    var mc=document.getElementById("msgCa");
    if(mc){mc.textContent=r2.ok?"Đã lưu.":"Lỗi: "+r2.loi;mc.className="msg "+(r2.ok?"ok":"err");}
    return;
  }
  if(t.hasAttribute("data-luumoc")){
    var khoa=t.getAttribute("data-luumoc"),cid2=t.getAttribute("data-cid"),box=t.closest(".sbox");
    var cu2=mocCua(cid2,khoa);
    var ck=box.querySelector('[data-mf="cong_khai"]');
    var bg={ca_id:cid2,khoa:khoa,
      ngay:box.querySelector('[data-mf="ngay"]').value||(cu2&&cu2.ngay)||"",
      noi_dung:box.querySelector('[data-mf="noi_dung"]').value.trim(),
      anh:box.querySelector('[data-mf="anh"]').value.split(",").map(function(s){return s.trim();}).filter(Boolean),
      cong_khai:ck?ck.checked:(cu2?!!cu2.cong_khai:false),
      nhay_cam:!!(STAGES.filter(function(s){return s.k===khoa;})[0]||{}).kin};
    if(cu2&&cu2.id&&CHE_DO==="mau")bg.id=cu2.id;
    await ghi("moc",bg,"ca_id,khoa");
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-luucv")){
    var sl=t.getAttribute("data-luucv"),bxc=t.closest(".card");
    var layc=function(n){var e=bxc.querySelector('[data-cv="'+n+'"]');return e?e.value.trim():"";};
    var cu3=(D.chuyen_vien||[]).filter(function(x){return x.slug===sl;})[0]||{};
    var r3=await ghi("chuyen_vien",{slug:sl, ten:cu3.ten||sl,
      anh:layc("anh")||null, vai_tro:layc("vai_tro")||null, gioi_thieu:layc("gioi_thieu")||null,
      bo_anh:layc("bo_anh").split(",").map(function(x){return x.trim();}).filter(Boolean)},"slug");
    if(r3&&r3.ok===false)alert("Chưa lưu được: "+r3.loi);
    oMo="";await lamMoi();return ve();
  }
  if(t.hasAttribute("data-themdong")){
    var bang=t.getAttribute("data-themdong"),cid3=t.getAttribute("data-cid"),bx=t.closest(".edit");
    var lay=function(n){var e=bx.querySelector('[data-nr="'+n+'"]');return e?e.value.trim():"";};
    var dong={ca_id:cid3,ngay:lay("ngay")};
    if(bang==="xet_nghiem"){dong.loai=lay("loai");dong.ket_qua=lay("ket_qua");}
    else{dong.moc_do=lay("loai");dong.cao=num(lay("cao"))||null;dong.nang=num(lay("nang"))||null;
         dong.thieu_cao=num(lay("thieu_cao"))||null;dong.dieu_chinh=lay("ket_qua");dong.cong_khai=false;}
    if(!dong.ngay&&!dong.loai&&!dong.moc_do)return;
    await ghi(bang,dong);
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-delcase")){
    if(!duocXoa())return;
    var idX=t.getAttribute("data-delcase"),cDel=getCa(idX);
    if(!confirm("Xoá hẳn hồ sơ "+(cDel?cDel.ten:idX)+" ("+idX+")?\n\nMốc hành trình, liệu trình, xét nghiệm và bài truyền thông của bé cũng mất theo. Không khôi phục được."))return;
    var r0=await xoa("ca",{id:idX});
    if(!r0.ok){alert("Không xoá được: "+r0.loi);return;}
    moCa=null;trang="ho-so";oMo="";
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-luuchuyen")){
    var cidC=t.getAttribute("data-luuchuyen");
    await ghi("ca",{id:cidC,cau_chuyen:document.getElementById("fChuyen").value.trim(),
      cau_chuyen_tt:document.getElementById("fChuyenTT").value,cau_chuyen_sua:new Date().toISOString()});
    oMo="";
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-luuanh")){
    var cidA=t.getAttribute("data-luuanh"),cA=getCa(cidA);
    if(!cA)return;
    var bia=document.getElementById("fAnhBia").value.trim();
    var moi=document.getElementById("fAnhMoi").value.trim();
    var ds=(cA.anh_ho_so||[]).slice();
    if(moi)ds.push(moi);
    await ghi("ca",{id:cidA,anh_bia:bia||null,anh_ho_so:ds});
    oMo="";
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-xoaanh")){
    var cidX=t.getAttribute("data-cid"),cX=getCa(cidX);
    if(!cX)return;
    if(!confirm("Gỡ ảnh này khỏi hồ sơ?"))return;
    var dsX=(cX.anh_ho_so||[]).slice();
    dsX.splice(+t.getAttribute("data-xoaanh"),1);
    await ghi("ca",{id:cidX,anh_ho_so:dsX});
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-themlt")){
    var bxl=t.closest(".edit"),gl=function(n){var e=bxl.querySelector('[data-lt="'+n+'"]');return e?e.value.trim():"";};
    if(!gl("san_pham")){bxl.querySelector('[data-lt="san_pham"]').focus();return;}
    await ghi("lieu_trinh",{ca_id:t.getAttribute("data-themlt"),san_pham:gl("san_pham"),lieu:gl("lieu"),
      so_luong:gl("so_luong"),tu_ngay:gl("tu_ngay")||null,dot_phac_do:gl("dot_phac_do")||"ban đầu"});
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-xoalt")){
    if(!confirm("Xoá dòng liệu trình này?"))return;
    await xoa("lieu_trinh",{id:+t.getAttribute("data-xoalt")});
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-themtt")){
    var bxt=t.closest(".edit"),gt=function(n){var e=bxt.querySelector('[data-tt="'+n+'"]');return e?e.value.trim():"";};
    if(!gt("link")&&!gt("tieu_de")){bxt.querySelector('[data-tt="link"]').focus();return;}
    await ghi("truyen_thong",{ca_id:t.getAttribute("data-themtt"),ngay:gt("ngay")||null,
      kenh:gt("kenh"),tieu_de:gt("tieu_de"),link:gt("link")});
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-xoatt")){
    if(!confirm("Xoá bài này khỏi danh sách?"))return;
    await xoa("truyen_thong",{id:+t.getAttribute("data-xoatt")});
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-xoadong")){
    if(!confirm("Xoá dòng này?"))return;
    await xoa(t.getAttribute("data-xoadong"),{id:+t.getAttribute("data-rid")});
    await lamMoi();
    return ve();
  }
  if(t.hasAttribute("data-khoa")){
    var uid=t.getAttribute("data-khoa");
    var u2=(D.nguoi_dung||[]).filter(function(x){return x.id===uid;})[0];
    if(!u2)return;
    await ghi("nguoi_dung",{id:uid,hoat_dong:!u2.hoat_dong});
    await lamMoi();
    return ve();
  }
  if(t.id==="themNhom"){
    var tn=document.getElementById("nqTen").value.trim();
    if(!tn)return;
    await ghi("nhom_quyen",{ma:khongDau(tn),ten:tn,mo_ta:document.getElementById("nqMoTa").value.trim(),
      quyen:{xem_ca:true,sua_ca:false,xem_nhay_cam:false,duyet_dang_ky:false,cong_khai:false,quan_tri:false}},"ma");
    await lamMoi();
    return ve();
  }
});

document.addEventListener("change",async function(ev){
  var el=ev.target;
  if(el.hasAttribute&&el.hasAttribute("data-ck-ca")){
    await ghi("ca",{id:el.getAttribute("data-ck-ca"),cong_khai:el.checked});
    await lamMoi();
    return ve();
  }
  if(el.hasAttribute&&el.hasAttribute("data-nhom-cua")){
    await ghi("nguoi_dung",{id:el.getAttribute("data-nhom-cua"),nhom:el.value});
    await lamMoi();
    ve();
    var m=document.getElementById("msgND");
    if(m){m.textContent="Đã đổi nhóm quyền.";m.className="msg ok";}
    return;
  }
  if(el.hasAttribute&&el.hasAttribute("data-q")){
    var ma=el.getAttribute("data-nhom"),q=el.getAttribute("data-q");
    var nh=(D.nhom_quyen||[]).filter(function(n){return n.ma===ma;})[0];
    if(!nh)return;
    var qq=Object.assign({},nh.quyen||{});qq[q]=el.checked;
    await ghi("nhom_quyen",{ma:ma,ten:nh.ten,mo_ta:nh.mo_ta,quyen:qq},"ma");
    await lamMoi();
    if(TOI&&TOI.nhom===ma)QUYEN=qq;
    return ve();
  }
});

document.getElementById("q").addEventListener("input",function(e){
  tim=e.target.value;
  if(tim.trim()){moCa=null;trang="ho-so";}
  ve();
});

function tuHash(){
  var hs=(location.hash||"").replace(/^#/,"");
  var m=/^ca\/(.+)$/.exec(hs);
  if(m&&getCa(decodeURIComponent(m[1]))){moCa=decodeURIComponent(m[1]);return;}
  moCa=null;
  if(cacTab().filter(function(t){return t.k===hs;}).length)trang=hs;
}
window.addEventListener("hashchange",function(){if(app.hidden)return;tuHash();ve();});

/* ===================== khởi động ===================== */
(async function(){
  var note=document.getElementById("demoNote");

  /* Đã khai báo địa chỉ database thì LUÔN là bản thật.
     Mất mạng hay lỗi thư viện thì báo lỗi và khoá cửa, tuyệt đối không
     rơi về chế độ xem thử - vì chế độ đó cho vào tự do. */
  if(daCauHinh()){
    CHE_DO="that";
    if(!window.supabase){
      loi("Không tải được thư viện kết nối. Kiểm tra mạng rồi tải lại trang.");
      document.getElementById("goBtn").disabled=true;
      return;
    }
    try{
      SB=window.supabase.createClient(CAU_HINH.url,CAU_HINH.anon_key);
      var s=await SB.auth.getSession();
      if(s.data&&s.data.session){
        var hs=await SB.from("nguoi_dung").select("*").eq("id",s.data.session.user.id).single();
        if(hs.data&&hs.data.hoat_dong){TOI=hs.data;await moApp();}
        else await SB.auth.signOut();
      }
    }catch(e){
      loi("Chưa kết nối được hệ thống. Kiểm tra mạng rồi tải lại trang.");
    }
    return;
  }

  /* Chỉ khi file chưa được khai báo địa chỉ database mới là bản xem thử. */
  CHE_DO="mau";
  note.hidden=false;
  note.innerHTML="<b>Bản xem thử, dùng dữ liệu mẫu.</b> File này chưa khai báo địa chỉ database nên "+
    "gõ email và mật khẩu nào cũng vào được, và mọi thay đổi chỉ nằm trên máy đang mở. "+
    "Bản chạy thật ở <code>keoday.midu.vn/login</code> thì phải đúng tài khoản mới vào.";
})();
</script>
