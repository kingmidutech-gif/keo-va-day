<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hành trình của con · Kéo và Đẩy</title>
<meta name="description" content="Hành trình phát triển chiều cao của một em nhỏ được chương trình Kéo và Đẩy đồng hành.">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
  :root{
    --cam:#DE7127; --cam-dam:#B4551A; --cam-sau:#8A3F11; --cam-toi:#5E2A0B;
    --cam-nhat:#FDF2EA; --cam-nhat2:#FAE3D2; --cam-vien:#F1CBAC;
    --vang:#FFBB00; --vang-chu:#8A6000; --vang-nhat:#FFF7E3; --vang-vien:#FFE08F;
    --trang:#FFFFFF; --vien:#EDE5DE;
    --ink:#111111; --ink-2:#1E1E1E; --ink-3:#3A3A3A; --ink-4:#6A5D54;
    --ok:#2C7A51; --ok-nen:#E2F3E9; --ok-vien:#B6DFC8;
    --bong:0 1px 2px rgba(17,17,17,.04), 0 10px 28px rgba(138,63,17,.08);
    --noi:inset 0 2px 0 rgba(255,255,255,.95), 0 12px 22px rgba(138,63,17,.09), 0 28px 46px rgba(138,63,17,.07);
    --r:18px; --r-sm:12px; --r-pill:24px;
    --dis:"Montserrat", system-ui, sans-serif;
    --sans:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{background:var(--cam-nhat);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;font-family:var(--dis);font-weight:800;letter-spacing:-.015em;text-wrap:balance}
  p{margin:0}
  img{max-width:100%}
  a{color:var(--cam-dam)}

  .dau{background:var(--trang);border-bottom:1px solid var(--vien)}
  .dau-in{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
  .dau img{width:98px;height:auto}
  .dau .ten-ct{font-family:var(--dis);font-weight:700;font-size:13px;color:var(--ink-3);margin-left:auto}

  .khung{max-width:760px;margin:0 auto;padding:0 20px 70px}
  .tai{padding:70px 20px;text-align:center;color:var(--ink-4)}

  /* mở đầu */
  .mo{background:linear-gradient(170deg,var(--vang-nhat) 0%,var(--cam-nhat2) 100%);
    border:1px solid var(--cam-vien);border-radius:26px;box-shadow:var(--bong);
    overflow:hidden;margin:24px 0 26px}
  .mo-in{padding:26px 24px;display:flex;gap:20px;align-items:center}
  @media(max-width:560px){.mo-in{flex-direction:column;text-align:center;padding:22px 18px}}
  .mo img.chan{width:128px;height:160px;object-fit:cover;border-radius:var(--r-sm);border:2px solid #fff;flex:0 0 auto}
  .mo .chu{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.18em;color:var(--cam-dam)}
  .mo h1{font-size:31px;margin:6px 0 6px;color:var(--cam-toi)}
  @media(max-width:560px){.mo h1{font-size:25px}}
  .mo .noi{font-size:14.5px;color:var(--ink-3)}
  .mo .gt{margin-top:11px;font-size:15.5px;color:var(--ink-2)}
  .vach{height:9px;background:repeating-linear-gradient(to right,var(--cam-vien) 0 1px,transparent 1px 9px)}

  .the{background:var(--trang);border:1px solid var(--vien);border-radius:var(--r);box-shadow:var(--bong);padding:20px 22px;margin-bottom:18px}
  .the h2{font-size:19px;color:var(--cam-toi);margin-bottom:12px}
  .nhan{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--cam-dam)}

  .chuyen p{font-size:16.5px;line-height:1.8;color:var(--ink-2);white-space:pre-wrap}

  /* so chuẩn */
  .so-chuan{margin-top:6px}
  .thanh{margin-top:14px}
  .thanh .nh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3);margin-bottom:6px}
  .thanh .nh b{font-family:var(--mono);color:var(--ink)}
  .thanh .ray{position:relative;height:24px;background:var(--cam-nhat2);border-radius:7px;overflow:hidden}
  .thanh .co{position:absolute;left:0;top:0;bottom:0;background:var(--cam);border-radius:7px 0 0 7px}
  .thanh .moc{position:absolute;top:0;bottom:0;right:0;width:3px;background:var(--vang-chu)}
  .thieu{font-size:13px;color:var(--cam-dam);margin-top:6px;font-weight:600}

  /* tiến bộ */
  .tien{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-top:6px}
  .o{background:var(--ok-nen);border:1px solid var(--ok-vien);border-radius:var(--r-sm);padding:13px 15px}
  .o .n{font-family:var(--dis);font-size:25px;font-weight:800;color:var(--ok);line-height:1.1}
  .o .l{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);margin-top:3px}
  .lan{margin-top:12px;display:grid;gap:7px}
  .lan div{background:var(--cam-nhat);border:1px solid var(--vien);border-radius:9px;padding:9px 13px;font-size:14px;display:flex;gap:12px;flex-wrap:wrap}
  .lan .ng{font-family:var(--mono);font-size:12.5px;color:var(--cam-dam);font-weight:600}

  /* hành trình vẽ thành con đường */
  .lo-trinh{position:relative;margin-top:10px}
  .lo-trinh svg.duong{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible}
  .lo-trinh .bong-duong{fill:none;stroke:rgba(138,63,17,.10);stroke-width:36;stroke-linecap:round;stroke-linejoin:round}
  .lo-trinh .vien-duong{fill:none;stroke:#EBC6A2;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
  .lo-trinh .mat-duong{fill:none;stroke:url(#menDuong);stroke-width:29;stroke-linecap:round;stroke-linejoin:round}
  .lo-trinh .tim-duong{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:13 15;stroke-linecap:round;opacity:.95}
  .lo-trinh .duoi-duong{fill:none;stroke:#EBC6A2;stroke-width:26;stroke-linecap:round;stroke-dasharray:0.1 30;opacity:.7}
  .cac-diem{position:relative;z-index:1}
  .diem{position:relative;display:flex;gap:16px;align-items:flex-start;min-height:132px;padding:4px 0}
  .diem .cot{flex:0 0 46px;display:flex;justify-content:center;padding-top:10px}
  .diem .bi{width:40px;height:40px;border-radius:50%;background:var(--cam);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--dis);font-weight:800;font-size:15px;
    box-shadow:0 0 0 4px #fff,0 0 0 9px var(--cam-nhat),0 8px 18px rgba(138,63,17,.26);
    transition:transform .18s ease}
  .diem .bi:hover{transform:scale(1.08)}
  .diem.cuoi .bi{background:var(--ok);box-shadow:0 0 0 4px #fff,0 0 0 9px var(--cam-nhat),0 8px 18px rgba(44,122,81,.3)}
  .diem .noi-dung{flex:1;min-width:0;background:var(--trang);border:1px solid var(--vien);
    border-radius:var(--r-sm);padding:14px 16px;box-shadow:var(--bong)}
  .diem .ngay{font-family:var(--mono);font-size:12.5px;color:var(--cam-dam);font-weight:600}
  .diem h3{font-size:16.5px;margin:2px 0 4px;color:var(--cam-toi)}
  .diem p{font-size:15px;color:var(--ink-3)}
  .diem .anh{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:11px}
  .diem .anh.mot{grid-template-columns:1fr}
  .diem .anh a{display:block;border-radius:11px;overflow:hidden;border:1px solid var(--vien);background:var(--cam-nhat2)}
  .diem .anh img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
  .diem .anh.mot img{aspect-ratio:16/10}
  .diem .lien{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .diem .lien a{font-size:13px;background:var(--vang-nhat);border:1px solid var(--vang-vien);
    border-radius:9px;padding:6px 12px;text-decoration:none;color:var(--vang-chu);font-weight:600}
  .anh-nguoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:12px}
  .anh-nguoi a{display:block;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--vien);background:var(--cam-nhat2)}
  .anh-nguoi img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
  .nguoi .vong img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .nguoi .vong.co-anh{padding:0;overflow:hidden}
  @media(max-width:679px){
    .diem{min-height:142px;gap:11px}
    .diem .cot{flex:0 0 60px}
    .diem .bi{width:36px;height:36px;font-size:14px}
    .diem .noi-dung{padding:12px 13px}
    .diem.phai .bi{transform:translateX(22px)}
    .diem.phai .bi:hover{transform:translateX(22px) scale(1.08)}
  }
  @media(min-width:680px){
    .diem{min-height:168px}
    .diem.phai{flex-direction:row-reverse}
    .diem.phai .noi-dung{margin-right:10px}
    .diem.trai .noi-dung{margin-left:10px}
    .diem .cot{flex:0 0 132px}
    .diem .noi-dung{max-width:min(430px, calc(100% - 156px))}
  }
  .cot-moc{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;
    background:var(--vang-nhat);border:1px solid var(--vang-vien);border-radius:var(--r-pill);
    padding:11px 20px;font-size:14.5px;color:var(--vang-chu);font-weight:600}

  .bai{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap;padding:11px 0;border-bottom:1px dashed var(--vien)}
  .bai:last-child{border-bottom:0}
  .bai .kenh{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    background:var(--vang-nhat);color:var(--vang-chu);border:1px solid var(--vang-vien);border-radius:var(--r-pill);padding:2px 10px}
  .bai .td{flex:1 1 220px;font-weight:600}
  .bai .ng{font-family:var(--mono);font-size:12.5px;color:var(--ink-4)}

  .cuoi{background:var(--trang);border:1px solid var(--vien);border-radius:var(--r);padding:22px;text-align:center;margin-top:22px}
  .cuoi p{font-size:15px;color:var(--ink-3);max-width:46ch;margin:0 auto}
  .nut{display:inline-block;margin-top:14px;background:var(--cam);color:#fff;text-decoration:none;
    border-radius:var(--r-pill);padding:12px 26px;font-weight:700;box-shadow:0 8px 18px rgba(222,113,39,.3)}
  .nut:hover{background:var(--cam-dam)}

  .trong{background:var(--trang);border:1px solid var(--vien);border-radius:26px;box-shadow:var(--bong);
    padding:48px 26px;text-align:center;margin:26px 0}
  .trong h1{font-size:25px;color:var(--cam-toi);margin-bottom:10px}
  .trong p{color:var(--ink-3);max-width:44ch;margin:0 auto}
  /* cây chương trình */
  .cay-khung{background:linear-gradient(180deg,var(--vang-nhat) 0%,var(--cam-nhat) 62%);
    border:1px solid var(--cam-vien);border-radius:26px;box-shadow:var(--bong);
    padding:20px 10px 10px;margin:24px 0 20px;overflow:hidden}
  .cay-khung svg{display:block;width:100%;height:auto}
  .qua{cursor:pointer}
  .qua circle{transition:r .15s ease}
  .qua:hover circle.than-qua{r:17}
  .qua text{font-family:var(--sans);font-size:12.5px;font-weight:700;fill:var(--cam-toi);
    paint-order:stroke;stroke:#FDF2EA;stroke-width:3.5;stroke-linejoin:round}
  .chu-nha{font-family:var(--sans);font-size:11.5px;font-weight:700;fill:#A2704A;
    paint-order:stroke;stroke:#FDF2EA;stroke-width:3;stroke-linejoin:round}
  .qua.cho text{fill:var(--ink-4)}
  .nhan-dot{font-family:var(--dis);font-size:15px;font-weight:800;fill:var(--cam-dam);letter-spacing:.02em}
  .nhan-dot.so{font-size:11.5px;fill:#A2704A}
  .nhan-dot.khi{font-size:11px;fill:#A2704A;font-weight:600}
  .ngon-chu{font-family:var(--dis);font-size:15.5px;font-weight:800;fill:#FFFFFF;letter-spacing:.01em}
  .chu-goc{font-family:var(--dis);font-size:16px;font-weight:800;fill:#fff}
  .chu-re{font-family:var(--sans);font-size:12.5px;fill:var(--cam-sau)}
  @media(max-width:760px){
    .qua text{font-size:17px;stroke-width:5}
    .nhan-dot{font-size:19.5px} .nhan-dot.so{font-size:15px} .nhan-dot.khi{font-size:14.5px}
    .ngon-chu{font-size:18px} .chu-goc{font-size:20px} .chu-re{font-size:15.5px}
  }
  .chu-giai{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:4px;font-size:13px;color:var(--ink-3)}
  .chu-giai i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

  /* anh chị em cùng nhà */
  .nha{background:var(--vang-nhat);border:1px solid var(--vang-vien);border-radius:var(--r);
    padding:16px 18px;margin-bottom:18px}
  .nha .dau{display:flex;gap:9px;align-items:center;font-size:10.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:.14em;color:var(--vang-chu)}
  .nha p{font-size:15px;color:var(--ink-2);margin-top:7px}
  .nha .ds{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
  .nha .ds a,.nha .ds span{display:inline-flex;align-items:center;gap:7px;background:var(--trang);
    border:1px solid var(--vang-vien);border-radius:var(--r-pill);padding:8px 15px;
    font-weight:700;font-size:14.5px;text-decoration:none;color:var(--cam-toi)}
  .nha .ds a:hover{border-color:var(--cam);color:var(--cam-dam)}
  .nha .ds span{color:var(--ink-4);font-weight:600}
  .mot-be .nha-nho{font-size:12.5px;color:var(--vang-chu);background:var(--vang-nhat);
    border:1px solid var(--vang-vien);border-radius:9px;padding:3px 9px;display:inline-block;margin-top:7px}

  /* bản đồ */
  .bd-khung{background:linear-gradient(180deg,#F4FAFB 0%,var(--cam-nhat) 100%);
    border:1px solid var(--cam-vien);border-radius:26px;box-shadow:var(--bong);
    padding:16px 12px 10px;margin:24px 0 14px;overflow:hidden}
  .bd-khung svg{display:block;width:100%;height:auto}
  .tinh{fill:#FBEFE4;stroke:#FFFFFF;stroke-width:1.1}
  .tinh.co-be{stroke:#7A370F;stroke-width:2.2;stroke-linejoin:round;cursor:pointer}
  .tinh.co-be.t0{fill:#E8914A}
  .tinh.co-be.t1{fill:#F3B071}
  .tinh.co-be.t2{fill:#D97A33}
  .tinh.co-be:hover{fill:#C65F18}
  .dao-chu{font-family:var(--sans);font-size:15px;font-weight:700;fill:#A2704A}
  .nhan-tinh{cursor:pointer}
  .nhan-tinh .ten{font-family:var(--dis);font-size:19px;font-weight:800;fill:var(--cam-toi)}
  .nhan-tinh .dem{font-family:var(--sans);font-size:15px;font-weight:600;fill:var(--cam-dam)}
  .nhan-tinh:hover .ten{fill:var(--cam)}
  .ghim-vp{cursor:default}
  .ghim-vp .ten{font-family:var(--dis);font-size:18px;font-weight:800;fill:#5A2E8C}
  .ghim-vp .dia{font-family:var(--sans);font-size:13.5px;fill:var(--ink-3)}
  .bd-giai{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:13.5px;color:var(--ink-3);margin-bottom:6px}
  .bd-giai i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:7px;vertical-align:-2px}
  .o-tinh{background:var(--trang);border:1px solid var(--vien);border-left:5px solid var(--cam);
    border-radius:var(--r);box-shadow:var(--bong);padding:18px 20px;margin-bottom:14px}
  .o-tinh h3{font-family:var(--dis);font-size:20px;color:var(--cam-toi);margin:0}
  .cum-nha{background:var(--vang-nhat);border:1px solid var(--vang-vien);border-radius:var(--r-sm);
    padding:12px 13px;margin-top:11px}
  .cum-nha .dau{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;
    color:var(--vang-chu);margin-bottom:9px}
  .o-tinh .noi{font-size:13.5px;color:var(--ink-4);margin-top:2px}

  /* trang chuyên viên */
  .nguoi{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .nguoi .vong{width:68px;height:68px;border-radius:50%;background:var(--vang-nhat);border:2px solid var(--vang-vien);
    display:flex;align-items:center;justify-content:center;font-family:var(--dis);font-weight:800;font-size:25px;color:var(--cam-dam)}
  .dsbe{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px;margin-top:6px}
  .mot-be{display:block;background:var(--trang);border:1px solid var(--vien);border-left:5px solid var(--cam);
    border-radius:var(--r-sm);padding:14px 16px;text-decoration:none;color:inherit;box-shadow:var(--bong)}
  .mot-be:hover{border-color:var(--cam-vien);transform:translateY(-2px)}
  .mot-be.cho{border-left-color:var(--cam-vien)}
  .mot-be .t{font-family:var(--dis);font-weight:800;font-size:17px;color:var(--cam-toi)}
  .mot-be .d{font-size:13.5px;color:var(--ink-3);margin-top:2px}
  .mot-be .s{font-family:var(--mono);font-size:12.5px;color:var(--cam-dam);margin-top:7px}
  .dem-lon{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin:4px 0 2px}
  .dem-lon div{background:var(--vang-nhat);border:1px solid var(--vang-vien);border-radius:var(--r-sm);padding:13px 15px}
  .dem-lon .n{font-family:var(--dis);font-size:26px;font-weight:800;color:var(--cam-toi);line-height:1.1}
  .dem-lon .l{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);margin-top:3px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="dau">
  <div class="dau-in">
    <a href="/"><img src="/logo-keo-day.png?v=2" alt="Chương trình Kéo và Đẩy"></a>
    <span class="ten-ct">Hành trình của con</span>
  </div>
</header>

<main class="khung" id="noi-dung">
  <div class="tai">Đang mở hồ sơ…</div>
</main>

<script>
var CAU_HINH = {
  url: "https://fwhaxdmnhcugwieurjuw.supabase.co",
  khoa: "sb_publishable_BdeFqL9ifXDmOWqWufoTkw__oWKtDQE"
};

var MOC_TEN = {
  "de-xuat":"Hồ sơ gửi về chương trình",
  "phac-do":"Phân tích thể trạng",
  "khao-sat":"Đoàn đến tận nhà",
  "tai-tro-xn":"Tài trợ làm xét nghiệm",
  "ket-qua-xn":"Kết quả xét nghiệm",
  "hop-noi-bo":"Chương trình họp xét",
  "quyet-dinh":"Quyết định đồng hành",
  "giao-hang":"Trao quyết định và sản phẩm",
  "theo-doi":"Theo dõi và đo lại",
  "tu-lieu":"Hình ảnh và video"
};
var THU_TU = ["de-xuat","phac-do","khao-sat","tai-tro-xn","ket-qua-xn","theo-doi","hop-noi-bo","quyet-dinh","giao-hang","tu-lieu"];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function ngay(s){if(!s)return"";var a=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(a)return a[3]+"/"+a[2]+"/"+a[1];
  var b=/^(\d{4})-(\d{2})$/.exec(s);if(b)return"tháng "+(+b[2])+"/"+b[1];return s;}
function so(v){return String(v).replace(".",",");}
function laAnh(u){return /\.(jpe?g|png|webp|gif|avif)(\?|#|$)/i.test(String(u));}
function yt(u){var m=String(u).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_\-]{6,})/);return m?m[1]:null;}
function tenMien(u){try{return String(u).replace(/^https?:\/\//,"").split("/")[0];}catch(e){return "liên kết";}}

function laySlug(){
  var p = location.pathname.replace(/\/+$/,"");
  var m = p.match(/\/be\/([^\/]+)$/i);
  if (m) return decodeURIComponent(m[1]);
  var q = new URLSearchParams(location.search).get("b");
  if (q) return q;
  if (location.hash.length > 1) return decodeURIComponent(location.hash.slice(1));
  return null;
}

/* Vẽ con đường uốn lượn nối các điểm dừng. Màn hẹp thì đường chạy thẳng bên trái. */
function veConDuong(){
  var khung = document.getElementById("loTrinh");
  var svg = document.getElementById("veDuong");
  if (!khung || !svg) return;
  var diem = [...khung.querySelectorAll(".diem .bi")];
  if (diem.length < 1) return;

  var g = khung.getBoundingClientRect();
  var toado = diem.map(function(b){
    var r = b.getBoundingClientRect();
    return { x: r.left - g.left + r.width/2, y: r.top - g.top + r.height/2 };
  });

  /* đoạn đầu: đường đi từ mép trên xuống điểm thứ nhất, hơi nghiêng cho đỡ cứng */
  var dau = toado[0];
  var ke = toado[1] || dau;
  var d = "M " + (dau.x + (dau.x - ke.x) * 0.22) + " 0" +
          " C " + dau.x + " " + (dau.y * 0.4) + ", " + dau.x + " " + (dau.y * 0.7) + ", " + dau.x + " " + dau.y;

  /* các đoạn giữa: điểm uốn đặt lệch nhau nên khúc cua mềm chứ không gấp */
  for (var i = 1; i < toado.length; i++) {
    var t = toado[i-1], p = toado[i];
    var cao = p.y - t.y;
    d += " C " + t.x + " " + (t.y + cao * 0.55) + ", " + p.x + " " + (p.y - cao * 0.55) + ", " + p.x + " " + p.y;
  }

  /* đuôi: chấm thưa dần, ý là con đường còn đi tiếp */
  var cuoi = toado[toado.length-1];
  var truoc = toado[toado.length-2] || cuoi;
  var dDuoi = "M " + cuoi.x + " " + cuoi.y +
    " C " + cuoi.x + " " + (cuoi.y + 40) + ", " +
            (cuoi.x + (cuoi.x - truoc.x) * 0.3) + " " + (g.height - 40) + ", " +
            (cuoi.x + (cuoi.x - truoc.x) * 0.3) + " " + g.height;

  svg.setAttribute("viewBox", "0 0 " + g.width + " " + g.height);
  svg.setAttribute("width", g.width);
  svg.setAttribute("height", g.height);
  svg.innerHTML =
    '<defs><linearGradient id="menDuong" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#FBE5D2"></stop>'+
      '<stop offset="1" stop-color="#F7D8BE"></stop>'+
    '</linearGradient></defs>'+
    '<path class="duoi-duong" d="'+dDuoi+'"></path>'+
    '<path class="bong-duong" d="'+d+'"></path>'+
    '<path class="vien-duong" d="'+d+'"></path>'+
    '<path class="mat-duong" d="'+d+'"></path>'+
    '<path class="tim-duong" d="'+d+'"></path>';
}

/* Gọi đúng: hai chị em, hai anh em, ba anh em, hay anh chị em khi có cả trai lẫn gái. */
var SO_CHU = ["", "Một", "Hai", "Ba", "Bốn", "Năm", "Sáu", "Bảy"];
function cumAnhChiEm(ds, thuong){
  var gt = ds.map(function(x){ return x.gioi_tinh; });
  var coNam = gt.indexOf("nam") >= 0, coNu = gt.indexOf("nu") >= 0;
  var tu = (coNam && coNu) ? "anh chị em" : (coNu ? "chị em" : "anh em");
  var so = SO_CHU[ds.length] || String(ds.length);
  var ra = so + " " + tu;
  return thuong ? ra.toLowerCase() : ra;
}

/* ---------- bỏ dấu để so khớp tên chuyên viên ---------- */
function khongDau(x){
  return String(x||"").toLowerCase()
    .replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g,"a").replace(/[èéẹẻẽêềếệểễ]/g,"e")
    .replace(/[ìíịỉĩ]/g,"i").replace(/[òóọỏõôồốộổỗơờớợởỡ]/g,"o")
    .replace(/[ùúụủũưừứựửữ]/g,"u").replace(/[ỳýỵỷỹ]/g,"y").replace(/đ/g,"d")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

async function veCay(SB){

  datTenDau("Những em nhỏ được đồng hành");

    SB.from("dot").select("*").order("thu_tu"),
    SB.from("ca").select("id,ten,slug,dot,dia_ban,de_xuat_boi,gia_dinh,gioi_tinh,cong_khai").eq("cong_khai", true).order("id")
  ]);
  var dot = t[0].data || [], ca = t[1].data || [];
  if (!ca.length) { khongThay("Chưa có em nhỏ nào được công bố", "Chương trình chưa công bố trường hợp nào."); return; }

  var nhom = dot.map(function(d){
    var be = ca.filter(function(c){ return c.dot === d.ma; });
    /* các bé cùng nhà xếp liền nhau để còn treo chung một cuống */
    be.sort(function(a, b){
      var ka = a.gia_dinh || ("~" + a.id), kb = b.gia_dinh || ("~" + b.id);
      return ka === kb ? String(a.id).localeCompare(String(b.id)) : ka.localeCompare(kb);

   [-88,34,78,0],[88,34,78,2],[0,2,118,1]].forEach(function(c){
    svg += '<circle cx="'+(xThan+c[0])+'" cy="'+(yNgon+c[1])+'" r="'+c[2]+'" fill="'+

    var diem = g.be.map(function(c, j){

      var pt = diemTrenCanh(xDau, yCanh, c1x, c1y, c2x, c2y, xCuoi, yCuoi, tyLe);
      return { c:c, x:pt.x, y:pt.y };
    });
    var day = Math.max.apply(null, diem.map(function(d){ return d.y; })) + 38;
    var soHang = (hep && diem.length > 3) ? 3 : 2;
    diem.forEach(function(d, j){ d.yQ = day + (j % soHang) * 42; });

    /* anh chị em ruột: một cuống chung chia ra mấy quả */
    var daVe = {};
    diem.forEach(function(d){
      if (!d.c.gia_dinh || daVe[d.c.gia_dinh]) return;
      var nhaNay = diem.filter(function(x){ return x.c.gia_dinh === d.c.gia_dinh; });
      if (nhaNay.length < 2) return;
      daVe[d.c.gia_dinh] = true;
      var xc = nhaNay.reduce(function(t, x){ return t + x.x; }, 0) / nhaNay.length;
      var yc = nhaNay.reduce(function(t, x){ return t + x.y; }, 0) / nhaNay.length;
      var yNut = yc + 24;
      svg += '<path d="M '+xc+' '+yc+' L '+xc+' '+yNut+'" stroke="#8A3F11" stroke-width="3.5" stroke-linecap="round"></path>'+
             '<circle cx="'+xc+'" cy="'+yNut+'" r="4" fill="#8A3F11"></circle>'+
             '<text class="chu-nha" x="'+(xc - huong*54)+'" y="'+(yNut + 4)+'" text-anchor="middle">'+
             esc(cumAnhChiEm(nhaNay.map(function(x){ return x.c; })))+'</text>';
      nhaNay.forEach(function(x){
        svg += '<path d="M '+xc+' '+yNut+' C '+xc+' '+(yNut+18)+', '+x.x+' '+(x.yQ-32)+', '+x.x+' '+(x.yQ-13)+
               '" stroke="#8A3F11" stroke-width="2.5" fill="none" stroke-linecap="round"></path>';
        x.chung = true;
      });
    });

    diem.forEach(function(d, j){
      var yQ = d.yQ;
      svg += '<g class="qua" onclick="location.href=\'/be/'+esc(d.c.slug)+'\'" role="link" tabindex="0">'+
        (d.chung ? '' : '<path d="M '+d.x+' '+d.y+' L '+d.x+' '+(yQ-13)+'" stroke="#8A3F11" stroke-width="2.5"></path>')+
        '<ellipse cx="'+(d.x+8)+'" cy="'+(yQ-16)+'" rx="10" ry="5" fill="#3E9467" transform="rotate(-24 '+(d.x+8)+' '+(yQ-16)+')"></ellipse>'+
        '<circle class="than-qua" cx="'+d.x+'" cy="'+yQ+'" r="15" fill="url(#menQua)" stroke="#FFF7F0" stroke-width="3"></circle>'+
        '<ellipse cx="'+(d.x-4.5)+'" cy="'+(yQ-5)+'" rx="4.5" ry="2.8" fill="#FFFFFF" opacity=".5" transform="rotate(-32 '+(d.x-4.5)+' '+(yQ-5)+')"></ellipse>'+
        '<text x="'+d.x+'" y="'+(yQ + 30)+'" text-anchor="middle">'+esc(tenNgan(d.c.ten))+'</text>'+
        '<title>'+esc(d.c.ten)+(d.c.dia_ban?' \u00b7 '+esc(d.c.dia_ban):'')+'</title></g>';
    });
  });

  /* ---- biển tên ở gốc ---- */
  svg += '<g><rect x="'+(xThan-106)+'" y="'+(yGoc-40)+'" width="212" height="48" rx="24" fill="#6E3009"></rect>'+
         '<text class="chu-goc" x="'+xThan+'" y="'+(yGoc-15)+'" text-anchor="middle">Midu MenaQ7</text></g>';
  svg += '</svg>';

  var tongBe = ca.length;
  document.getElementById("noi-dung").innerHTML =
    '<section class="mo"><div class="mo-in"><div>'+
      '<div class="chu">Chương trình Kéo và Đẩy</div>'+
      '<h1>'+tongBe+' em nhỏ đang được đồng hành</h1>'+
      '<p class="gt">Chương trình vẽ lại tất cả thành một cái cây. Gốc rễ là Midu MenaQ7 và quỹ trách nhiệm xã hội nuôi chương trình. '+
      'Mỗi cành là một chuyến đi về một tỉnh, cành thấp nhất là chuyến đầu tiên, đọc từ gốc lên là đi theo thời gian. '+

/* Gom các bé cùng nhà vào một cụm, để nhìn là biết mấy em là người một nhà. */
function gomTheoNha(be){
  var nha = [], le = [], da = {};
  be.forEach(function(c){
    if (c.gia_dinh) {
      if (da[c.gia_dinh]) return;
      var cung = be.filter(function(x){ return x.gia_dinh === c.gia_dinh; });
      da[c.gia_dinh] = true;
      if (cung.length > 1) { nha.push(cung); return; }
    }
    le.push(c);
  });
  var the = function(c){
    return '<a class="mot-be" href="/be/'+esc(c.slug)+'">'+
      '<div class="t">'+esc(c.ten)+'</div>'+
      '<div class="d">'+esc([c.tuoi, c.dia_ban].filter(Boolean).join(" · "))+'</div>'+
      '<div class="d" style="margin-top:7px;color:var(--cam-dam);font-weight:600">Xem hành trình →</div></a>';
  };
  var h = "";
  nha.forEach(function(cung){
    h += '<div class="cum-nha"><div class="dau">👨‍👩‍👧‍👦 '+esc(cumAnhChiEm(cung))+' ruột</div>'+
         '<div class="dsbe">'+cung.map(the).join("")+'</div></div>';
  });
  if (le.length) h += '<div class="dsbe" style="margin-top:11px">'+le.map(the).join("")+'</div>';
  return h;
}

/* Ghim một địa điểm theo kinh độ vĩ độ thật. Màu xanh, khác hẳn màu của các con. */
function ghimNoi(nhom, bd, lon, lat, ten, dia, daDung){
  var c = bd.chieu;
  if (!c) return;
  var x = (lon - c.lon0) * c.k * c.he, y = (c.lat1 - lat) * c.he;
  var nx = Math.min(x + 34, bd.w - 330), ny = y;
  while ((daDung || []).some(function(v){ return Math.abs(v - ny) < 58; })) ny -= 58;
  var rong = Math.max(300, ten.length * 11 + 60);
  nhom.insertAdjacentHTML("beforeend",
    '<g class="ghim-vp">'+
      '<path d="M '+x+' '+y+' L '+(nx-10)+' '+ny+'" stroke="#6D3FA3" stroke-width="2"></path>'+
      '<path d="M '+x+' '+(y+4)+' C '+(x-13)+' '+(y-10)+', '+(x-11)+' '+(y-28)+', '+x+' '+(y-28)+
        ' C '+(x+11)+' '+(y-28)+', '+(x+13)+' '+(y-10)+', '+x+' '+(y+4)+' Z" fill="#6D3FA3"></path>'+
      '<circle cx="'+x+'" cy="'+(y-18)+'" r="5" fill="#FFFFFF"></circle>'+
      '<rect x="'+nx+'" y="'+(ny-29)+'" width="'+rong+'" height="58" rx="17" fill="#FFFFFF" opacity=".93" stroke="#D9C7EC" stroke-width="1.5"></rect>'+
      '<text class="ten" x="'+(nx+17)+'" y="'+(ny-5)+'">'+esc(ten)+'</text>'+
      '<text class="dia" x="'+(nx+17)+'" y="'+(ny+16)+'">'+esc(dia)+'</text>'+
    '</g>');
}

/* danh sách người giới thiệu, đặt dưới cây */
function dsChuyenVien(ca){
  var m = {};
  ca.forEach(function(c){
    if (!c.de_xuat_boi) return;
    var k = khongDau(c.de_xuat_boi);
    if (!m[k]) m[k] = { ten: c.de_xuat_boi, slug: k, so: 0 };
    m[k].so++;
  });
  var ds = Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){ return b.so - a.so; });
  if (!ds.length) return "";
  return '<section class="the" style="margin-top:22px"><h2>Những người đã giới thiệu các em</h2>'+
    '<p style="font-size:15px;color:var(--ink-3);margin-bottom:4px">Mỗi hồ sơ bắt đầu từ một người sống gần đứa trẻ đủ lâu để nhận ra điều bất thường.</p>'+
    '<div class="dsbe">'+ds.map(function(n){
      return '<a class="mot-be" href="/chuyen-vien/'+encodeURIComponent(n.slug)+'">'+
        '<div class="t">'+esc(n.ten)+'</div>'+
        '<div class="s">Đã giới thiệu '+n.so+' em nhỏ</div></a>';
    }).join("")+'</div></section>';
}

/* điểm trên đường cong bậc ba, để treo quả đúng trên cành */
function diemTrenCanh(x0,y0,x1,y1,x2,y2,x3,y3,t){
  var u = 1-t;
  return {
    x: u*u*u*x0 + 3*u*u*t*x1 + 3*u*t*t*x2 + t*t*t*x3,
    y: u*u*u*y0 + 3*u*u*t*y1 + 3*u*t*t*y2 + t*t*t*y3
  };
}
function tenNgan(ten){
  var p = String(ten||"").trim().split(/\s+/);
  return p.length > 2 ? p.slice(-2).join(" ") : ten;
}

    (boAnh.length ? '<section class="the"><h2>Hình ảnh</h2><div class="anh-nguoi">'+
      boAnh.map(function(u){
        return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+
          '<img src="'+esc(u)+'" alt="Ảnh hoạt động của '+esc(ten)+'" loading="lazy"></a>';
      }).join("")+'</div></section>' : '')+

    '<section class="cuoi"><div class="nhan">Chương trình Kéo và Đẩy</div>'+
    '<p style="margin-top:9px">Chuyên viên chiều cao là người phát hiện, đề xuất và theo dõi từng trường hợp tại địa phương. '+
    'Không có họ thì chương trình không biết những đứa trẻ này ở đâu.</p>'+
    '<a class="nut" href="/cac-be">Xem tất cả các em nhỏ</a></section>';
}
function so2(v){ return String(v).replace(".", ","); }

/* Xếp các mốc theo đúng ngày xảy ra. Mốc chưa ghi ngày thì nằm ngay sau
   mốc trước nó trong quy trình, chứ không bị đẩy lên đầu. */
function sapTheoNgay(ds){
  var moc_so = function(x){
    var m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(String(x || ""));
    return m ? Number(m[1] + m[2] + (m[3] || "00")) : null;
  };
  var co = ds.map(function(m, i){ return { m:m, i:i, k:moc_so(m.ngay) }; });
  var truoc = 0;
  co.forEach(function(x){ if (x.k) truoc = x.k; else x.k = truoc; });
  co.sort(function(a, b){ return a.k === b.k ? a.i - b.i : a.k - b.k; });
  return co.map(function(x){ return x.m; });
}

function thanh(nhan, co, chuan, dv){
  var pct = Math.max(6, Math.min(100, co/chuan*100));
  var thieu = Math.round((chuan-co)*10)/10;
  return '<div class="thanh"><div class="nh"><span>'+esc(nhan)+'</span>'+
    '<span><b>'+so(co)+' '+dv+'</b> · chuẩn '+so(chuan)+' '+dv+'</span></div>'+
    '<div class="ray"><span class="co" style="width:'+pct.toFixed(1)+'%"></span><span class="moc"></span></div>'+
    (thieu > 0 ? '<div class="thieu">thiếu '+so(thieu)+' '+dv+' so với bạn cùng tuổi</div>' : '')+
    '</div>';
}

function duongDan(){
  var p = location.pathname.replace(/\/+$/,"").toLowerCase();
  if (/\/(cac-be|cay)$/.test(p)) return { loai:"cay" };
  if (/\/ban-do$/.test(p)) return { loai:"ban-do" };
  var m = location.pathname.replace(/\/+$/,"").match(/\/chuyen-vien\/([^\/]+)$/i);
  if (m) return { loai:"chuyen-vien", slug: decodeURIComponent(m[1]) };
  var t = new URLSearchParams(location.search);
  if (t.get("t") === "cay") return { loai:"cay" };
  if (t.get("t") === "ban-do") return { loai:"ban-do" };
  if (t.get("cv")) return { loai:"chuyen-vien", slug: t.get("cv") };
  var s = laySlug();
  return s ? { loai:"be", slug:s } : { loai:"khong-biet" };
}

(async function(){
  var r0 = duongDan();
  if (r0.loai === "khong-biet") { khongThay("Không tìm thấy trang", "Đường dẫn này không có trên trang chương trình."); return; }
  if (!window.supabase) { khongThay("Chưa tải được dữ liệu", "Kiểm tra kết nối mạng rồi tải lại trang."); return; }
  var SB = window.supabase.createClient(CAU_HINH.url, CAU_HINH.khoa);

  if (r0.loai === "cay") { return veCay(SB); }
  if (r0.loai === "ban-do") { return veBanDo(SB); }
  if (r0.loai === "chuyen-vien") { return veChuyenVien(SB, r0.slug); }
  var slug = r0.slug;

  try {
    var r = await SB.from("ca").select("*").eq("slug", slug).eq("cong_khai", true).limit(1);
    if (r.error) throw new Error(r.error.message);
    var c = (r.data || [])[0];
    if (!c) { khongThay("Không tìm thấy hồ sơ này", "Có thể đường dẫn chưa đúng, hoặc hồ sơ chưa được chương trình công bố."); return; }

    var t = await Promise.all([
      SB.from("moc").select("*").eq("ca_id", c.id),
      SB.from("tai_danh_gia").select("*").eq("ca_id", c.id).order("ngay"),
      SB.from("truyen_thong").select("*").eq("ca_id", c.id).order("ngay", {ascending:false}),
      c.gia_dinh
        ? SB.from("ca").select("id,ten,slug,tuoi,gioi_tinh,cong_khai").eq("gia_dinh", c.gia_dinh).eq("cong_khai", true)
        : Promise.resolve({ data: [] })
    ]);
    veTrang(c, t[0].data || [], t[1].data || [], t[2].data || [],
            (t[3].data || []).filter(function(x){ return x.id !== c.id; }));
  } catch (e) {
    khongThay("Chưa mở được hồ sơ", "Hệ thống đang bận. Thử lại sau ít phút.");
  }
})();
</script>
